summary: >-
  Accela ships no MCP server. There is no hosted endpoint, no first-party stdio package on any registry, and
  no mention of MCP anywhere on accela.com or developer.accela.com — even though Accela markets AI heavily
  (three white papers on AI in government, an acquired "Civira AI" agent suite, and a "From Generative to
  Agentic" playbook, all listed in its own llms.txt). The tools below are a CANDIDATE set derived from the
  published contract; nothing here is served by Accela today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    Probed 2026-09-06: https://mcp.accela.com/ does not resolve; https://apis.accela.com/mcp returns the
