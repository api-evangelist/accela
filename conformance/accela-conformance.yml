trust_center:
  exists: false
  note: >-
    trust.accela.com is not a trust center — it is a CNAME onto Atlassian Statuspage serving the login-gated
    "Accela Status" page. Compliance evidence is a marketing page plus PDFs (an Accela Security
    Self-Assessment and the Subscription Services Agreement) rather than a portal. No TrustCenter pointer is
    emitted.
