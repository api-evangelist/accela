summary: Accela Construct permission scopes. Each scope represents a group of API resources an access token may
  reach; a token is requested with an explicit scope list and the user is prompted to consent to it. The scope registry
  is not published as a standalone reference page and does not appear in any securityDefinitions block — Accela
  declares the scope for each operation inline, as a "**Scope**:" line in that operation's description in the published
  Swagger 2.0 documents. This file is that registry, extracted operation by operation from all fifteen specs in
  openapi/ and cross-checked against the docs page that describes how scopes are consented to.
flows:
- authorization_code
- implicit
- password
consent: An app requests a scope list at token time; the user is shown the list and must Allow. The get_civicid_profile
  scope is always included whether or not it is requested.
always_granted:
- get_civicid_profile
scope_count: 32
operations_mapped: 411
unmapped_operations: 6
unmapped_note: Operations with no "**Scope**:" line in their published description. Most are the three oauth2 endpoints
  on auth.accela.com, which are not scope-gated, plus a small number of operations whose description omits the field.
