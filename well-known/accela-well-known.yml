method: probed
source: live probes of /.well-known/ and /llms.txt on every Accela host this record knows
summary: >-
  Two real documents were found across seven hosts. www.accela.com (and the apex accela.com) serves a
  genuine llms.txt — a Yoast-SEO-generated marketing index of pages, posts, customer stories and white
  papers, with no API content in it. success.accela.com serves a real RFC 8414 / OIDC discovery document,
  which is the Salesforce Experience Cloud identity configuration behind the Accela Success Community —
  it is a real served document on a host Accela controls, but it is NOT the Construct API authorization
  server (that is auth.accela.com, which serves nothing at /.well-known/). No security.txt anywhere, no
  api-catalog, no ai-plugin.json, and no A2A agent card on any host at either the canonical or the
  legacy path.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the 200 at success.accela.com/.well-known/openid-configuration.
  SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every Accela host probed.
  LLMsTxt pointer emitted separately for the served /llms.txt.
false_positive_watch: >-
  admin.accela.com answers HTTP 200 with the Construct Admin Portal SPA shell for EVERY /.well-known/*
  path and for /llms.txt, including paths that cannot exist. Those 200s are recorded below as MISSES,
  not hits. Any future round that reads an admin.accela.com /.well-known/ 200 as a served document is wrong.
