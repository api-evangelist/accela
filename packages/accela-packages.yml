summary: >-
  The Accela Developer Portal's "SDKs and Samples" tile links to github.com/Accela-Inc, where all fifteen
  public repositories are ARCHIVED and none of them is an API client. Two first-party client libraries do
  exist in public registries and both are abandoned: the Node.js Construct client last shipped in July 2019,
  and the .NET SDK — still described as "for Windows & Windows Phone" — last shipped in October 2014, twelve
  years ago, against a platform Microsoft discontinued. The only first-party package with a current release
  is @accela/design-system, which is a UI component library for Accela's own products, not an API client.
  For an API that shipped 63 dated releases between 2014 and 2026, that is the sharpest decay signal in this
  profile: the contract is maintained, the client libraries around it are not.
