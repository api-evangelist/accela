summary: >-
  Accela publishes one client-side component library, @accela/design-system, under its own npm scope. It is a
  design system for building UI consistent with Accela's products, not an embeddable API surface: there are no
  hosted or prebuilt widgets, no embedded dashboards, and no drop-in payment or permit-application elements
  that a third party can mount against an agency tenant. It is included here because it is the only actively
  released first-party package Accela ships, and because it is frequently mistaken for an SDK.
