basePath: /
host: apis.accela.com
info:
  description: The Assets and Assessments APIs enable apps to manage assets and their related condition assessments.
  title: Assets and Assessments
  version: v4
schemes:
- https
swagger: '2.0'
tags:
- name: Assets
  description: 'Assets can be any object that an agency owns or maintains. Assets have standard properties such as date of
    service, start value, current value, depreciation value, salvage value, size, etc.


    To manage and organize assets and asset types, Civic Platform supports several levels of asset classifications. Each asset
    is classified with an asset type, and each asset type can be organized within a group or by class type.


    In general, assets are classified by the following standard class types:


    <br/>- **Linear** - The linear class type indicates a relationship between two assets. For example, a section of street,
    sidewalk, or runway at the city municipal airport.<br/>- **Node** - Node-link linear combines assets to indicate an explicit
    relationship between the assets. Node-link linear requires the user to define the asset ID by identifying the assets on
    each end of the linear asset. For example, define a sewer main by identifying its end points such as Manholes. Manhole
    ''MH-01'' flows to manhole ''MH-02'' which flows to manhole ''MH-03.'' The node-link linear allows for the creation of
    the Sewer Main asset by naming the beginning and end point assets of each pipe. In this example, the agency can create
    two Sewer Main assets such as class type of node-link linear defined as ''MH-01 - MH-02'' and ''MH-02 - MH-03.''<br/>-
    **Component** - The component class specifies assets that are independent and do not connect assets as a building or tools.
    A component is free of lines and nodes.<br/>- **Polygon** - The polygon class type includes assets such as water drainage
    area, a storm drainage area, or a catch basin.'
- name: Assets/Assessments
  description: Condition assessments apply to assets that change or deteriorate over time. These assets may require a visual
    condition assessment to effectively manage their life cycle. Transaction records and documents can also be attached to
    assets. In Civic Platform, an asset is created based on its asset type. An asset type can be associated to specific work
    order types ("record types"), rating types, and usage types.
- name: Assets/Attributes
  description: In addition to these asset properties, assets can also have custom attributes which are customized characteristics
    of assets, structures, and establishments. Asset custom attributes can be grouped into a template, which can be used to
    create an asset. In addition to custom attributes, asset attribute data can be collected into an attribute table.
- name: Assets/Documents
  description: Document collaterals can be attached to assets.
- name: Assets/Records
  description: Assets can be associated to transactional records when an asset assessment necessitates a service work order
    or if an application pertains to an agency asset.
- name: Assessments
  description: 'In Civic Platform, an assessment is synonymous to an asset condition assessment. An asset condition assessment
    is a scheduled maintenance review and/or a quality review of a group of assets. Agencies may require such assessments
    for many different asset types such as vehicles, buildings, and water lines. Agencies may set different intervals for
    different asset types as well. For example, agency vehicles might require safety and emissions inspections yearly, while
    water lines might require an assessment every three months.


    In Civic Platform, an assessment is created based on its assessment type. An assessment type defines the assessment''s
    custom attributes, rating types, and observation attributes.'
- name: Assessments/Attributes
  description: An agency can define custom attributes for each type of assessment.
- name: Assessments/Documents
  description: Inspectors can attach documents and photos as needed to the asset condition assessment record, and record the
    assignments and costs that occur on the assessment.
- name: Assessments/Observations
  description: 'During an assessment, an inspector may make observations about the condition of the asset. For example, he
    may go to a certain area to look at the condition of the sidewalk and determine if there any cracks or whether the sidewalk
    is level. The inspector also looks at the area around the section sidewalk to determine whether trees or brushes block
    the walking path. After the inspector completes the assessment, the inspector can log his findings assessment observation,
    which he can modify later as more information becomes available. '
- name: Assessments/Work Orders
  description: Asset assessments often alert agencies to problems that need attention. A work order is the starting point
    in the repair process. Associating a work order with an assessment helps track the work order's progress.
paths:
  /v4/assets:
    get:
      description: "Returns all assets. Specify at least one URI filter parameter: asssetId, group, type, name.\n\n\n\n**API\
        \ Endpoint**:  GET /v4/assets \n\n**Scope**:  assets \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access\
        \ token \n\n**Civic Platform version**: 9.0.0\n\n"
      summary: Get All Assets
      operationId: v4.get.assets
      tags:
      - Assets
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: 'Filter by asset ID. '
        in: query
        name: assetId
        type: string
      - description: Filter by asset name.
        in: query
        name: name
        type: string
      - description: Filter by asset group. See [Get All Asset Groups](./api-settings.html#operation/v4.get.settings.assets.groups).
        in: query
        name: group
        type: string
      - description: Filter by asset type. See [Get All Asset Types](./api-settings.html#operation/v4.get.settings.assettypes.types).
        in: query
        name: type
        type: string
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_assetMasterModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/assets/{ids}:
