        \ records can be requested via the expand parameter.\n\n\n\n**API Endpoint**:  GET /v4/assets/{ids} \n\n**Scope**:\
        \  assets \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 9.0.0\n\
        \n"
