      description: "Search assets by geolocation and asset query parameters. \n\n\n\n**API Endpoint**:  POST /v4/search/assets\
        \ \n\n**Scope**:  assets \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 9.2.0\n\n"
      operationId: v4.post.search.assets
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: query
        description: Asset query parameters
        required: true
        schema:
          $ref: '#/definitions/request_searchAssets'
      - name: limit
        in: query
        description: The maximum number of items in the result set.
        required: false
        type: integer
        format: int64
      - name: offset
        in: query
        description: The first record of the result set starts at the specified offset position.
        required: false
        type: integer
        format: int64
      - name: fields
        in: query
        type: string
        description: Comma-delimited names of fields to be returned in the response. Field names are case-sensitive and only
          first-level fields are supported. Invalid field names are ignored.
      - name: lang
        in: query
        type: string
        description: Language parameter to support I18N. Default language is en_US.
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria.'
          schema:
            $ref: '#/definitions/response_searchAssets'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/search/global:
    get:
      description: "Finds records that meet the search criteria across the agency.\n\n\n\n**API Endpoint**:  GET /v4/search/global\
