basePath: /
schemes:
- http
host: apis.accela.com
info:
  description: "Accela API for searching Civic Platform objects \n\nThe Search API provides apps with a global search feature\
    \ to locate records and objects in the system database. In the global search, you specify search criteria and you view\
    \ the records that meet the criteria in a global scope.You can further organize the search results by applying filters\
    \ to the results set.\n\nAnother important use for searches is to ensure valid reference data are used with transaction\
    \ data. For example, searching for valid address, parcel, and owner objects ensures that data integrity and business rules\
    \ are enforced when creating records. \n\n Construct search API's use the HTTP POST method to allow an extensive set of\
    \ search parameters in the request body. \n\n **Using Wildcards** \n\n A wildcard is a special character (%) you can use\
    \ in your search criteria to represent one or more characters in a string of characters. When used, it can represent an\
    \ undefined value. Where you place the wildcard character determines which part of the name or phrase you are not searching\
    \ for. \n\n Note: The Accela API does not support the use of wildcards for all fields. \n\n **Example Use Case** \n\n\
    \ You are searching for an owner with the last name equal or similar to Johnson. You enter %son as the search criterion.\
    \ The search result includes all names it finds ending in \"son\", including Johnson and Thompson. If you enter john%,\
    \ the search results includes all names beginning with \"John\", including Johnson, Johnston, and Johns. If you enter\
    \ %john% and click search, the results include all names with \"john\" anywhere within the whole name, including Johnson,\
    \ or St. Johns. \n\n **Advanced Search** \n\n If you perform advanced search with multiple fields, the search follows\
    \ the following general rules:<br/> * If you base a search on two or more detail search fields, the system uses AND to\
    \ locate that contain all the search criteria. For example, if you pick two fields within the record detail search fields,\
    \ the search applies this rule. <br/> * If you base a search on fields across different categories, such as between record\
    \ search fields and Address, Parcel, Owner (APO) template search fields, Accela Construct uses the AND rule to perform\
    \ the search. For example, if you pick one record detail search fields and one search field from the APO template, the\
    \ search applies this rule. <br/> * If you base a search on two or more Task Spec Info, App Spec Info, or APO template\
    \ search fields, Accela Construct uses AND to locate records that contain only one of the search criteria. For example,\
    \ if you pick two fields within the APO template, the search applies to this rule. <br/> * If you base a search on two\
    \ fields from the record detail search and the APO template, Accela Construct uses AND and OR to perform the search."
  title: Search
  version: v4
swagger: '2.0'
paths:
  /v4/search/addresses:
    post:
      description: "Finds the addresses that match the search criteria. Specify at least one search criteria.\n\n\n\n**API\
        \ Endpoint**:  POST /v4/search/addresses \n\n**Scope**:  addresses \n\n**App Type**:  All \n\n**Authorization Type**:\
        \  Access token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Search Addresses
      operationId: v4.post.search.addresses
      parameters:
      - description: Reference address search query.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/addressSearchModel'
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      - description: Parameter for getting expanded record information.
        enum:
        - parcels, owners
        in: query
        name: expand
        required: false
        type: string
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_addressModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
