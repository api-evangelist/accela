        \ version**: \t7.3.2\n\n"
      summary: Search All
      operationId: v4.get.search.global
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Global search query.
        in: query
        name: query
        required: false
        type: string
      - description: Allowed entity type. The system only currently supports Record, Address, Parcel and License Professional
          for citizen user.
        enum:
        - RECORD
        - ADDRESS
        - LICENSEPROFESSIONAL
        - ASSET
        - CONTACT
        - PARCEL
        - DOCUMENT
        in: query
        name: type
        required: false
        type: string
      - description: Comma-separated modules to query.
        in: query
        name: modules
        required: false
        type: string
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - description: The result set is sorted by the specified field name. Specify the sort order in the "direction" parameter.
          The default sort order is the ascending order.
        in: query
        name: sort
        required: false
        type: string
      - description: Sort direction. Default is ASC.
        enum:
        - ASC
        - ' DESC'
        in: query
        name: direction
        required: false
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_globalSearchArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
