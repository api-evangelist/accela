  /v4/search/records:
    post:
      summary: Search Records
      description: "Finds the records that match the search criteria.\n\n\n\n**API Endpoint**:  POST /v4/search/records \n\
        \n**Scope**:  records \n\n**App Type**:  All \n\n**Authorization Type**:  No authorization required \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      operationId: v4.post.search.records
      parameters:
      - description: Construct oAuth2 authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: "Contains the record search criteria. For example: '\r\n{\r\n \"id\": \"12BCM-00000-01540\"}'"
        in: body
        name: body
        schema:
          $ref: '#/definitions/recordSearchModel'
      - description: The offset position of the first record in the results response array. For example, if offset is 100,
          the first item in the results array in the response is the 100th record in the search result list.
        format: int64
        in: query
        name: offset
        type: integer
      - description: Search result size limit.
        format: int64
        in: query
        name: limit
        type: integer
      - description: Comma-delimited list of related objects to be returned with the record. The related object(s) will be
          returned only if data exists; if data does not exist, the requested object(s) will not be included in the response.
        enum:
        - addresses
        - parcels
        - professionals
        - contacts
        - owners
        - customForms
        - customTables
        in: query
        name: expand
        type: string
      - name: expandCustomForms
        description: 'Valid values: "addresses"


          If {expand} includes any of addresses, parcels, owners, or contacts, {expandCustomForms} specifies which {expand}
          objects should include custom forms. By default, custom forms for addresses, parcels, owners, and contacts are not
          included in the response data. Note that requesting APO custom forms may have performance implications, depending
          on the amount of data and connectivity to any external data source.


          Added in Civic Platform version: 9.2.0

          '
        in: query
        type: string
        enum:
        - addresses
      - description: The API allow consumer to specify return field with resource. The values are case-sensitive fields name
          of JSON object and be split by comma.
        in: query
        name: fields
        type: string
      - description: Language parameter to support I18N. Default language is en_US
        in: query
        name: lang
        type: string
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_recordModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
