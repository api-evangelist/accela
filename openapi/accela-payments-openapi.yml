        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/payments/transactions/{id}/fees:
    get:
      description: "Returns fees information for a given transaction id.\n\n\n\n**API Endpoint**:  GET /v4/payments/transactions/{id}/fees\
