basePath: /
host: apis.accela.com
schemes:
- https
swagger: '2.0'
info:
  description: "The Payments API enables apps to submit payment transactions on Civic Platform records.\r\n\t\tThe Payments\
    \ API provides two ways of accepting payments:\r\n\n\n ***Using third-party payment vendors*** \r\n\n\nPayment API endpoints\
    \ that save payment information from an external third-party payment vendor, to which the user is redirected for payment\
    \ processing:\r\n\n\n **Initialize Payment** - Initializes a Civic Platform payment transaction with a citizen's payment\
    \ information such as record ID, third-party merchant account ID, and payment method. The Initialize Payment API returns\
    \ a transaction ID which should be used as the payment ID when calling the Commit Payment API to save the payment details\
    \ from the third-party merchant into Civic Platform.\r\n\n\n **Commit Payment** - Triggers PaymentReceiveBefore and PaymentReceiveAfter\
    \ events which can interact with third-party payment processing, and saves payment details in Civic Platform. Use the\
    \ transaction ID returned by the Initialize Payment API to identify the payment transaction to be committed. Note that\
    \ an app cannot use the Commit Payment API unless a Construct agency administrator enables the Payment Enabled setting\
    \ on [Construct Admin Portal](https://admin.accela.com) > Agencies > {Agency} > Apps."
  title: Payments
  version: v4
tags:
- name: Payments
  description: Payments represent the acceptance of monetary funds submitted to the agency in relation to a transactional
    record. The system uses payments to invoice for services rendered and to create credit card transactions for payment.
- name: Invoices
  description: An invoice fee can either be generated manually in the Civic Platform's Payment Processing portlet or automatically
    if configured in Civic Platform Administration. The Invoice API enables apps to get invoices and create record invoices.
- name: Trust Accounts
  description: "Agency customers can deposit money into a trust account that the customer can drawn from when they need to\
    \ pay fees for an application. This is helpful for customers that have a large amount of work they regularly perform in\
    \ your jurisdiction, such as contractors or developers.\\\r\n\t\tn\\ n\r\n\t\tCivic Platform allows you toset up trust\
    \ accounts\r\n\t\tfor address,\r\n\t\tparcels,\r\n\t\tlicensed professionals and contacts.The trust account functionality\
    \ allows you to establish and maintain trust account information,\r\n\t\tperform trust account transactions,\r\n\t\tand\
    \ print trust account reports.\n\\ n\r\n\t\tWith the trust account feature,\r\n\t\tusers canset one primary trust account\
    \ and associate the trust account with one record or multiple records.\n\\ n\r\n\t\tCivic Platform can send an email notification\
    \ to the trust account manager when the trust account balance drops below a certain amount.For example,\r\n\t\tif the\
    \ trust account has a $100 threshold amount and the trust account falls below $50,\r\n\t\tAccela Automation sends an e\
    \ - mail notification to the trust account manager.\n\\ n\r\n\t\tAdministrators can assign one or more trust accounts\
    \ as global to one or more modules,\r\n\t\twhich makes the trust accounts available to all records within the specified\
    \ module.This feature allows users to access a temporary trust accounts to process refunds.\r\n\t\t"
- name: Shopping Carts
  description: "Shopping carts allow public users to add and manage multiple record payment\r\n\t\ttransactions.A shopping\
    \ cart contains attributes indicating the payment processing type and whether the shopping cart item is to be paid now.\r\
    \n\t\t"
paths:
  /v4/payments/initialize:
    post:
      description: "Initializes citizen payment information for processing by a third party payment system that will send\
        \ and commit final payment information into Automation. Call Initialize Payment to get the transaction ID required\
        \ to call Commit Payment. Note: This API does not consider fees that have been marked as Pay Later in ACA.\n\n\n\n\
        **API Endpoint**:  POST /v4/payments/initialize \n\n**Scope**:  payments \n\n**App Type**:  Citizen \n\n**Authorization\
        \ Type**:  Access token \n\n**Civic Platform version**: 7.3.3.5\n\n"
      summary: Initialize Payment
      operationId: v4.post.payments.initialize
      tags:
      - Payments
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Payment initialization request information.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/paymentInitializeModel'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_paymentTransactionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/payments/{id}:
    put:
      description: "Processes and commits citizen payment information for the specified payment transaction ID. The Commit\
        \ Payment API allows a third-party payment vendor to send payment information to Automation. The Commit Payment API\
        \ processes the payment information, logs merchant account audit information, triggers the EMSE events ConvertToRealCAPBefore\
        \ and PaymentReceiveBefore, creates a transaction record, triggers the EMSE event ConvertToRealCAPAfter, finishes\
        \ the Automation payment, triggers the EMSE event PaymentReceiveAfter, and appoves the transaction.\n\nNote: An agency\
        \ Construct administrator controls which apps can call Commit Payment. By default, Commit Payment is disabled. To\
        \ allow an app to call Commit Payment, an agency administrator must go to the [Construct Admin Portal](https://admin.accela.com)\
        \ > Agencies > {Agency} > Apps, and enable the Payment Enabled property for the app.\n\n\n\n**API Endpoint**:  PUT\
        \ /v4/payments/{id} \n\n**Scope**:  payments \n\n**App Type**:  Citizen \n\n**Authorization Type**:  Access token\
        \ \n\n**Civic Platform version**: \t7.3.3.4\n\n"
      summary: Commit Payment
      operationId: v4.put.payments.id
      tags:
      - Payments
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The Transaction ID of an initialized transaction to be committed. Also known as "Batch Transaction Number".
        in: path
        name: id
        required: true
        type: string
      - description: The payment information to commit.
        in: body
        name: body
        schema:
          $ref: '#/definitions/paymentCommitModel'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_paymentCommitResultModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/payments/{paymentId}/void:
    put:
      description: "Voids a given payment. When you void a payment, Civic Platform decreases the total payment amount and\
        \ then increases the balance owed, as if you never made the payment.\n\n\n\n**API Endpoint**:  PUT /v4/payments/{paymentId}/void\
        \ \n\n**Scope**:  payments \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 9.0.0\n\n"
      summary: Void Payment
      operationId: v4.put.payments.paymentId.void
      tags:
      - Payments
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The id of the payment to void. See [Get All Payments for Record](./api-records.html#operation/v4.get.records.recordId.payments)
        in: path
        name: paymentId
        required: true
        type: string
      - description: Payment information to void.
        in: body
        name: body
        required: true
        schema:
