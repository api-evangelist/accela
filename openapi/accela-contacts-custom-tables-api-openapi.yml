openapi: 3.2.0
info:
  description: The Contacts and Professionals APIs enable apps to manage reference contacts and licensed professionals.
  title: Contacts and Professionals Contacts/Custom Tables API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Contacts/Custom Tables
paths:
  /v4/contacts/{contactId}/customTables:
    get:
      description: 'Gets the custom tables associated with the specified contact.


        **API Endpoint**: GET /v4/contacts/{contactId}/customTables


        **Scope**: contacts


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Get All Custom Tables for Contact
      operationId: v4.get.contacts.contactId.customTables
      tags:
      - Contacts/Custom Tables
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/contactId'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_tableModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    put:
      description: 'Updates a custom table for the specified contact.


        **API Endpoint**: PUT /v4/contacts/{contactId}/customTables


        **Scope**: contacts


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Update Custom Tables for Contact
      operationId: v4.put.contacts.contactId.customTables
      tags:
      - Contacts/Custom Tables
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/contactId'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/tableModel'
              type: array
        description: Custom tables to be updated.
        required: true
  /v4/contacts/{contactId}/customTables/meta:
    get:
      description: 'Gets the metadata associated with all custom tables for the contact.


        **API Endpoint**: GET /v4/contacts/{contactId}/customTables/meta


        **Scope**: contacts


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Get All Custom Tables Metadata for Contact
      operationId: v4.get.contacts.contactId.customTables.meta
