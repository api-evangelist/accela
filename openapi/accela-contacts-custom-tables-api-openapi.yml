  /v4/contacts/{contactId}/customTables/{tableId}/meta:
    get:
      description: 'Gets the metadata associated with the specified custom table for the contact.


        **API Endpoint**: GET /v4/contacts/{contactId}/customTables/{tableId}/meta


        **Scope**: contacts


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Get Custom Table Metadata for Contact
      operationId: v4.get.contacts.contactId.customTables.tableId.meta
      tags:
      - Contacts/Custom Tables
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/contactId'
      - description: The ID of the custom table to fetch.
        in: path
        name: tableId
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
