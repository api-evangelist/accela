          enum:
          - Y
          - N
          type: string
        role:
          description: The citizen user's role
          enum:
          - CONTRACT_INSPECTOR
          - CITIZEN
          - AUTH_AGENT_CLERK
          - AUTH_AGENT
          - SELF_CERTIFIED_INSPECTOR
