openapi: 3.2.0
info:
  description: The Citizens API include endpoints for citizen users to manage their own accounts, authorized users to manage other accounts, and manage citizen delegates, announcements, and invitations.
  title: Citizens Citizen Access Self-Registration API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Citizen Access Self-Registration
  description: The **citizenaccess** API endpoints allow a logged-in Citizen Access user to register and manage his or her own account profile, status, and contacts.
paths:
  /v4/citizenaccess/register:
    post:
      description: 'Registers a new citizen user. The agency name is required in the HTTP header x-accela-agency. The userName to be registered is required. Note: 7.3.3.4 version supports only 1 contact in the request contacts[]. Multiple contacts will be supported in a future release.


        **API Endpoint**: POST /v4/citizenaccess/register


        **Scope**: users


        **App Type**: All


        **Authorization Type**: No authorization required


        **Civic Platform version**: 7.3.3.4'
      summary: Register Citizen
      operationId: v4.post.citizenaccess.register
      tags:
      - Citizen Access Self-Registration
      parameters:
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_publicUserRegisterModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/publicUserRegisterModel'
        description: The user profile to register.
  /v4/citizenaccess/profile:
    get:
      description: 'Gets the profile for the currently logged in citizen user.


        **API Endpoint**: GET /v4/citizenaccess/profile


        **Scope**: users


        **App Type**: Citizen


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Get My Citizen Profile
      operationId: v4.get.civicid.citizenaccess.profile
      tags:
      - Citizen Access Self-Registration
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/citizenProfileModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/citizenaccess/contacts:
    get:
      description: 'Gets the contacts for the currently logged in citizen user.


        **API Endpoint**: GET /v4/citizenaccess/contacts


        **Scope**: users


        **App Type**: Citizen


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Get My Contacts
      operationId: v4.get.civicid.citizenaccess.contacts
      tags:
      - Citizen Access Self-Registration
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/citizenContactModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    post:
      description: 'Adds contacts to the currently logged in citizen user.


        **API Endpoint**: POST /v4/citizenaccess/contacts


        **Scope**: users


        **App Type**: Citizen


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Create My Contacts
      operationId: v4.post.civicid.citizenaccess.contacts
      tags:
      - Citizen Access Self-Registration
      parameters:
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultCountModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              items:
                description: A reference contact id.
                type: string
              type: array
        description: An array of reference contact IDs to add.
        required: true
  /v4/citizenaccess/contacts/{ids}:
    delete:
      description: 'Deletes the specified contacts from the currently logged in user.


        **API Endpoint**: DELETE /v4/citizenaccess/contacts/{ids}


        **Scope**: users


        **App Type**: Citizen


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Delete My Contacts
      operationId: v4.delete.civicid.citizenaccess.contacts.ids
      tags:
      - Citizen Access Self-Registration
      parameters:
      - description: Comma-delimited IDs of contacts to delete.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultCountModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
components:
  schemas:
    response_publicUserRegisterModel:
      type: object
      required:
      - userName
      properties:
        associatedLicenseIds:
          description: Contains license ID's associated with the citizen user.
          items:
            format: int64
            type: integer
          type: array
        cellPhone:
          description: The citizen user's cell phone number.
          type: string
        contacts:
          items:
            $ref: '#/components/schemas/peopleModel'
          type: array
        email:
          description: The citizen user's email address.
          type: string
        id:
          description: The citizen id assigned by the Civic Platform server.
          format: int64
          type: integer
        password:
          description: The citizen user's password.
          type: string
        questions:
          description: Contains the security questions for password reset.
          items:
            $ref: '#/components/schemas/publicUserQuestionModel'
          type: array
        receiveSMS:
