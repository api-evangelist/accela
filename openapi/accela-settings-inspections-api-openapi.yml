openapi: 3.2.0
info:
  description: The Settings API provides configuration values that have been defined in Civic Platform Administration, typically as standard choice values. The Settings APIs are helpful when you need reference or custom-configured values in your API calls.
  title: Settings/Inspections API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Settings/Inspections
paths:
  /v4/settings/inspections/checklists:
    get:
      description: 'Gets all checklists you can use for an inspection.


        **API Endpoint**: GET /v4/settings/inspections/checklists


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Checklists
      operationId: v4.get.settings.inspections.checklists
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by checklist group. See [Get All Checklist Groups](./api-settings.html#operation/v4.get.settings.inspections.checklistsGroups).
        in: query
        name: group
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_checklistModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklists/{ids}:
    get:
      description: 'Gets specific checklists.


        **API Endpoint**: GET /v4/settings/inspections/checklists/{ids}


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get Checklists
      operationId: v4.get.settings.inspections.checklists.ids
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the checklists to fetch.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_checklistModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklists/{checklistId}/checklistItems/{checklistItemid}/customForms:
    get:
      description: 'Gets the metadata for all custom forms for the specified checklist item.


        **API Endpoint**: GET /v4/settings/inspections/checklists/{checklistId}/checklistItems/{checklistItemid}/customForms


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Custom Forms Metadata for Checklist Item
      operationId: v4.get.settings.inspections.checklists.checklistId.checklistItems.checklistItemId.customForms
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The ID of the checklist to fetch.
        in: path
        name: checklistId
        required: true
        schema:
          type: string
      - description: The ID of the checklist item to fetch.
        in: path
        name: checklistItemid
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_customFormMetadataModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklists/{checklistId}/checklistItems/{checklistItemid}/customTables:
    get:
      description: 'Gets the metadata of all custom tables for the specified checklist item.


        **API Endpoint**: GET /v4/settings/inspections/checklists/{checklistId}/checklistItems/{checklistItemid}/customTables


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Custom Tables Metadata for Checklist Item
      operationId: v4.get.settings.inspections.checklists.checklistId.checklistItems.checklistItemId.customTables
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The id of the checklist to fetch.
        in: path
        name: checklistId
        required: true
        schema:
          type: integer
          format: int64
      - description: The id of the checklist item to fetch.
        in: path
        name: checklistItemid
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_customTableMetadataModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklistsGroups:
    get:
      description: 'Gets the checklist groups for use with an inspection.


        **API Endpoint**: GET /v4/settings/inspections/checklistsGroups


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Checklist Groups
      operationId: v4.get.settings.inspections.checklistsGroups
