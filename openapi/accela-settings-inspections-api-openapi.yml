        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklists/statuses:
    get:
      description: 'Gets the status values for checklists


        **API Endpoint**: GET /v4/settings/inspections/checklists/statuses


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3'
      summary: Get Inspection Checklist Statuses
      operationId: v4.get.settings.inspections.checklists.statuses
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by status group
        in: query
        name: group
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_checklistItemStatusModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/types:
    get:
      description: 'Gets all available inspection types.


        **API Endpoint**: GET v4/settings/inspections/types


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Inspection Types
      operationId: v4.get.settings.inspections.types
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by inspection type group code.
        in: query
        name: group
        schema:
          type: string
      - description: The related objects to be returned with the response. The related object(s) will be returned if data exists; if data does not exist, the requested object(s) will not be included in the response.
        in: query
        name: expand
        schema:
          type: string
          enum:
          - associations
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionTypeModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/types/{ids}:
    get:
      description: 'Gets specific inspection types.


        **API Endpoint**: GET /v4/settings/inspections/types/{ids}


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get Inspection Types
      operationId: v4.get.settings.inspections.types.ids
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of inspection types to fetch.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - description: The related objects to be returned with the response. The related object(s) will be returned if data exists; if data does not exist, the requested object(s) will not be included in the response.
        in: query
        name: expand
        schema:
          type: string
          enum:
          - associations
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionTypeModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/types/{id}/comments/groups:
    get:
      description: 'Gets the standard comment groups for a given inspection type.


        **API Endpoint**: GET /v4/settings/inspections/types/{id}/comments/groups


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 9.3.0'
      summary: Get All Standard Comment Groups for Inspection Type
      operationId: v4.get.settings.inspections.type.comments.groups
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - in: path
        name: id
        description: The system id of the inspection type to fetch. See [Get All Inspection Types](./api-settings.html#operation/v4.get.settings.inspections.types).
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_standardCommentGroupModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/checklistItems/{checklistItemId}/comments/groups:
    get:
      description: 'Gets the standard comment groups for a given checklist item.


        **API Endpoint**: GET /v4/settings/inspections/checklistItems/{checklistItemId}/comments/groups


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 9.3.0'
      summary: Get All Standard Comment Groups for Inspection Checklist
      operationId: v4.get.settings.inspections.checklistItems.checklistItemId.comments.groups
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - in: path
        name: checklistItemId
        description: The system id of the checklist item to fetch. For valid values, use the id field in items[] returned by [Get All Checklists](./api-settings.html#operation/v4.get.settings.inspections.checklists).
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_standardCommentGroupModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/grades:
    get:
      description: 'Gets all available grades for use in an inspection.


        **API Endpoint**: GET /v4/settings/inspections/grades


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Inspection Grades
      operationId: v4.get.settings.inspections.grades
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by the inspection grade group
        in: query
        name: group
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionGradeModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/inspections/statuses:
    get:
      description: 'Gets all available status values for use in an inspection.


        **API Endpoint**: GET /v4/settings/inspections/statuses


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Inspection Statuses
      operationId: v4.get.settings.inspections.statuses
      tags:
      - Settings/Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by the inspection status group.
        in: query
        name: group
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionResultStatusModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
