components:
  schemas:
    inspectionTypeAssociationsModel:
      type: object
      properties:
        standardCommentGroup:
          type: object
          description: The name of the standard comment group associated with the inspection type.
          properties:
            text:
              description: The localized display value.
              type: string
            value:
              description: The data value.
              type: string
    response_standardCommentGroupModelArray:
      type: object
      properties:
        result:
          items:
            $ref: '#/components/schemas/standardCommentGroupModel'
          type: array
    inspectionResultStatusModel:
      type: object
      properties:
        group:
          description: The inspection status group.
          type: string
        results:
          description: Contains the inspection grades.
          items:
            $ref: '#/components/schemas/gradeModel'
          type: array
    gradeModel:
      type: object
      properties:
        grade:
          type: object
          description: The name of the inspection grade.
          properties:
            text:
              description: The localized display value.
              type: string
            value:
              description: The data value.
              type: string
        gradeImage:
          description: The link to an image file associated to the inspection grade.
          type: string
        group:
          description: The inspection grade group for the inspection grade value.
          type: string
        maximumMajorViolation:
          description: "\tUsed with the maxMajorViolation field to define a range of the acceptable number of major violations for an inspection."
          format: int64
          type: integer
        maximumScore:
          description: "\tUsed with the minScore field to define a range of acceptable values for an inspection."
          format: int64
          type: integer
        minimumMajorViolation:
          description: "\tUsed with the maxMajorViolation field to define a range of the acceptable number of major violations for an inspection."
          format: int64
          type: integer
        minimumScore:
          description: "\tUsed with the maxScore field to define a range of acceptable values for an inspection."
          format: int64
          type: integer
    customTableMetadataModel:
      description: Contains the metadata for a custom table.
      type: object
      properties:
        displayOrder:
          description: The custom table's display order.
          format: int64
          type: integer
        fields:
          items:
            $ref: '#/components/schemas/customFormField'
          type: array
        id:
          description: The custom table id.
          type: string
        text:
          description: The custom table name.
          type: string
    checklistGroupModel:
      type: object
      properties:
        id:
          description: The checklist group id.
          type: string
        text:
          description: The checklist group name.
          type: string
        value:
          description: The checklist group value.
          type: string
    inspectionGradeModel:
      type: object
      properties:
        grades:
          description: Contains the inspection grades.
          items:
            $ref: '#/components/schemas/gradeModel'
          type: array
        group:
          description: The inspection grade group.
          type: string
    rGuideSheetGroupModel:
      type: object
      properties:
        id:
          description: The inspection checklist sytem id assigned by the Civic Platform server.
          type: string
        text:
          description: The localized display text.
          type: string
        value:
          description: The stored value.
          type: string
    response_checklistGroupModelArray:
      type: object
      properties:
        result:
          items:
            $ref: '#/components/schemas/checklistGroupModel'
          type: array
        status:
          type: integer
          description: The HTTP return status.
    checklistModel:
      type: object
      properties:
        group:
          items:
            description: A checklist group.
            type: string
          type: array
        id:
          description: The checklist id.
          type: string
        items:
          items:
            $ref: '#/components/schemas/checklistItemModel'
          type: array
        serviceProviderCode:
          description: The agency unique identifier.
          type: string
        text:
          description: The checklist name.
          type: string
    aSITableDrill:
      description: Contains drilldown field information.
      type: object
      properties:
        children:
          items:
            $ref: '#/components/schemas/childDrill'
          type: array
        isRoot:
          type: boolean
    response_checklistItemStatusModelArray:
      type: object
      properties:
        result:
          items:
            $ref: '#/components/schemas/checklistItemStatusModel'
          type: array
        status:
          type: integer
          description: The HTTP return status.
    checklistItemStatusModel:
      type: object
      properties:
        criticalScore:
          description: "\tThe critical score for the status of a guidesheet item that is a Major Violation/Critical Item."
          format: int64
          type: integer
        displayOrder:
          description: "\tThe order of the item in comparison to the other items."
          format: int64
          type: integer
        lhsType:
          description: "\tIndicates whether or not the checklist is for LHS (Life/Health/Safety). For LHS-type items, the maximum point value becomes the default score."
          type: string
        majorViolation:
          description: "\tThe number of major violations."
          type: string
        nonCriticalScore:
          description: "\tThe non-critical score for the status of a guidesheet item that is not a Major Violation/Critical Item."
          format: int64
          type: integer
        resultType:
          description: "\tThe type of result that can be ascibed to an inspection. There are three result types: Approved: Approves (passes) the checklist item. Denied: Denies (fails) the checklist item. Informational: Indicates that the checklist items do not need a status of app."
          type: string
        text:
          description: The checklist status name.
          type: string
        value:
          description: The checklist status value.
          type: string
    response_inspectionGradeModelArray:
      type: object
      properties:
        result:
          items:
            $ref: '#/components/schemas/inspectionGradeModel'
          type: array
        status:
          type: integer
          description: The HTTP return status.
    checklistItemModel:
      description: Contains the checklist items.
      type: object
      properties:
        comment:
          description: Comments about the checklist item.
          type: string
        defaultScore:
          description: "\tThe default score associated with the checklist item."
          format: int64
          type: integer
        displayOrder:
          description: "\tThe order of the item in comparison to the other items."
          format: int64
          type: integer
        id:
          description: The ID of the checklist item assigned by the Civic Platform server.
          format: int64
          type: integer
        isCarryOver:
          description: "\tIndicates whether or not the checklist is a carry-over."
          type: string
        isCommentVisible:
          description: "\tIndicates whether or not the comment is visible in a checklist."
          type: string
        isCritical:
          description: "\tIndicates whether or not the checklist item is critical."
          type: string
        isMaxPointsVisible:
          description: "\tIndicates whether or not to display the maximum points for the inspection checklist."
          type: string
        isScoreVisible:
          description: "\tIndicates whether or not to display the inspection checklist score."
          type: string
        maxPoints:
          description: "\tThe number of points allowed for an inspection, after which the inspection fails."
          format: double
          type: number
        statusGroup:
          description: Defines a set of status values for use with inspection types that conform to similar code requirements. For example, status groups for building related inspections, such as mechanical, electrical, uniform plumbing, and zoning.
          type: string
        statuses:
          description: Uses several parameters to characterize the status of one or more inspection checklists
          items:
            $ref: '#/components/schemas/checklistItemStatusModel'
          type: array
        text:
          description: The checklist item name.
          type: string
    departmentModel:
      type: object
      properties:
        agency:
          description: The department agency
          type: string
        bureau:
          description: The name of the bureau, which is an organization level within an agency.
          type: string
        division:
          description: The name of the division, which is an organization level within a bureau.
          type: string
        group:
          description: The department group.
          type: string
        id:
          description: The department system id assigned by the Civic Platform server.
          type: string
        office:
          description: An organization level within a group. An office is the final level within an organization structure. Agency->Bureau->Division->Section->Group->Office.
          type: string
        section:
          description: A piece of a township measuring 640 acres, one square mile, numbered with reference to the base line and meridian line.
          type: string
        serviceProviderCode:
          description: The unique agency identifier
          type: string
        text:
          description: The department display text.
          type: string
        value:
          description: The department value.
          type: string
    customFormMetadataModel:
      description: Contains the metadata for a custom form.
      type: object
      properties:
        displayOrder:
          description: The custom form's display order.
          format: int64
          type: integer
