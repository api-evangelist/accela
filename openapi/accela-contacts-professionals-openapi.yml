basePath: /
host: apis.accela.com
schemes:
- https
swagger: '2.0'
info:
  description: The Contacts and Professionals APIs enable apps to manage reference contacts and licensed professionals.
  title: Contacts and Professionals
  version: v4
tags:
- name: Contacts
  description: "A reference contact captures information about people or organizations involved in a business process. Contacts\
    \ include licensed professionals, such as contractors, architects, engineers, and developers for which your agency maintains\
    \ saved data. Contacts also include individuals related to a specific application or parcel, such as the applicant, billing\
    \ contacts, or legal representatives.\n\n You can add new contacts to your system, or update information about existing\
    \ contacts. As you manage applications and parcels on your system, you can keep track of certain individuals related to\
    \ an application or a parcel. For example, you can keep track of the legal counsel for a property owner, or the accountant\
    \ responsible for any fees assessed on a certain application."
- name: Contacts/Addresses
- name: Contacts/Conditions
- name: Contacts/Custom Forms
- name: Contacts/Custom Tables
- name: Contacts/Records
- name: Professionals
  description: A professional is a contractor, architect, engineer, developer, or associated organization. The system requires
    that all professionals be licensed. Similar to reference contacts, licensed professionals can be attached to transactional
    records as they are assigned to process applications.
- name: Professionals/Conditions
- name: Professionals/Records
paths:
