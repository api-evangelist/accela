openapi: 3.2.0
info:
  description: The Contacts and Professionals APIs enable apps to manage reference contacts and licensed professionals.
  title: Professionals Contacts API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Contacts
  description: A reference contact captures information about people or organizations involved in a business process.
paths:
  /v4/contacts:
