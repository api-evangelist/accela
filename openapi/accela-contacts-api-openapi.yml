      description: 'Gets all contacts available in the system.


        **API Endpoint**: GET /v4/contacts


        **Scope**: contacts


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Contacts
      operationId: v4.get.contacts
      tags:
      - Contacts
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by contact's address state.
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: Filter by contact's address country.
        in: query
        name: country
        required: false
        schema:
          type: string
      - description: Filter by contact's first name.
        in: query
        name: firstName
        required: false
        schema:
          type: string
      - description: Filter by contact's middle name.
        in: query
        name: middleName
        required: false
        schema:
          type: string
      - description: Filter by contact's last name.
        in: query
        name: lastName
        required: false
        schema:
          type: string
      - description: Filter by contact's email address.
        in: query
        name: email
        required: false
        schema:
          type: string
      - description: Filter by contact's first line of address.
        in: query
        name: addressLine1
        required: false
        schema:
          type: string
      - description: Filter by contact's second line of address.
        in: query
        name: addressLine2
        required: false
        schema:
          type: string
      - description: Filter by contact's third line of address.
        in: query
        name: addressLine3
        required: false
        schema:
          type: string
      - description: Filter by contact's business name.
        in: query
        name: businessName
        required: false
        schema:
          type: string
      - description: Filter by contact's address city.
        in: query
        name: city
        required: false
        schema:
          type: string
      - description: Filter by contact's title.
        in: query
        name: title
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
