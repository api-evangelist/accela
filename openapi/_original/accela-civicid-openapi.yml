        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    delete:
      description: "Deletes the specified user account that is linked to the currently logged-in CivicId user. Specify the\
        \ required agency name in the HTTP header x-accela-agency, and the optional environment in the HTTP header x-accela-environment.\
        \ The default environment is PROD.\n\n\n\n**API Endpoint**:  DELETE /v4/civicid/accounts/{id}  \n\n**Scope**:  civicid\
        \ \n\n**App Type**:  All \n\n**Authorization Type**:  Access tokeon \n\n**Civic Platform version**: All\n\n"
      operationId: v4.delete.civicid.accounts.id
      summary: Delete Linked User Account
      tags:
