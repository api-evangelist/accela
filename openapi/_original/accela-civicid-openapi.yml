basePath: /
host: apis.accela.com
info:
  description: Civic ID is a userid that allows a user to login multiple Accela products including Civic Platform and Accela
    apps, as well as social network apps such as Facebook and Twitter. Civic ID is agency agnostic; it allows a user to link
    multiple agency Citizen Access accounts to a single login account which enables cross-agency searches. The Civic ID has
    a profile and has links to one or more user accounts.
  title: CivicId
  version: v4
schemes:
- https
swagger: '2.0'
paths:
  /v4/civicid/accounts:
    get:
      description: "Gets all user accounts that are linked to the currently logged in civicID user.\n\n\n\n**API Endpoint**:\
        \  GET /v4/civicid/accounts \n\n**Scope**:  civicid \n\n**App Type**:  All \n\n**Authorization Type**:  Access tokeon\
        \ \n\n**Civic Platform version**: All\n\n"
      summary: Get All Linked User Accounts
      tags:
      - CivicId
      parameters:
      - description: Construct oAuth2 authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - in: query
        name: lang
        required: false
        type: string
        description: Language parameter to support I18N. Default language is en_US.
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_linkedAccounts'
        '400':
          description: Invalid request.
          schema:
            type: string
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    post:
      description: "Links an agency or user account to the currently logged-in CivicId user. The user account to be linked\
        \ must be a valid user account in Automation or Accela Citizen Access. Specify the required agency name in the HTTP\
        \ header x-accela-agency, and the optional environment in the HTTP header x-accela-environment. The default environment\
        \ is PROD.\n\n\n\n**API Endpoint**:  POST /v4/civicid/accounts \n\n**Scope**:  civicid \n\n**App Type**:  All \n\n\
        **Authorization Type**:  Access tokeon \n\n**Civic Platform version**: All\n\n"
      operationId: v4.post.civicid.accounts
      summary: Create Linked User Account
      tags:
      - CivicId
      parameters:
      - description: Construct oAuth2 authentication token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Account information to link with user.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/accountModel'
      - description: Language parameter to support I18N. Default language is en_US
        in: query
        name: lang
        required: false
        type: string
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_linkedAccount'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/civicid/accounts/{id}:
    get:
      description: "Gets the specified user account that is linked to the currently logged in civicID user.\n\n\n\n**API Endpoint**:\
        \  GET /v4/civicid/accounts/{id} \n\n**Scope**:  civicid \n\n**App Type**:  All \n\n**Authorization Type**:  Access\
        \ tokeon \n\n**Civic Platform version**: All\n\n"
      operationId: v4.get.civicid.accounts.id
      summary: Get Linked User Account
