openapi: 3.2.0
info:
  description: Use the Inspections API to manage inspection records during their complete lifecycle from application submittal to permit issuance or license issuance. Your agency may need to complete inspections on new property developments, homes, or complaints.
  title: Inspections API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Inspections
paths:
  /v4/inspections:
    get:
      description: 'Gets a list of inspections stored in the system.


        **API Endpoint**: GET /v4/inspections


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Inspections
      operationId: v4.get.inspections
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by multiple (comma-delimited) inspection types. See [Get All Inspection Types](./api-settings.html#operation/v4.get.settings.inspections.types).
        in: query
        name: types
        required: false
        schema:
          type: string
      - description: The start date of schedule date range filter. Use the date format yyyy-mm-dd.
        in: query
        name: scheduledDateFrom
        required: false
        schema:
          type: string
      - description: The end date of schedule date range filter. Use the date format yyyy-mm-dd.
        in: query
        name: scheduledDateTo
        required: false
        schema:
          type: string
      - description: 'Filter by inspector IDs. See [Get All Inspectors](./api-inspections.html#operation/v4.get.inspectors). '
        in: query
        name: inspectorIds
        required: false
        schema:
          type: string
      - description: Filter by district IDs.
        in: query
        name: districtIds
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - description: Filter by module.
        in: query
        name: module
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{ids}:
    get:
      description: 'Gets the information for one or more requested inspections.


        **API Endpoint**: GET /v4/inspections/{ids}


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get Inspections
      operationId: v4.get.inspections.ids
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to fetch.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    delete:
      description: 'Deletes one or more specified inspections.


        **API Endpoint**: DELETE /v4/inspections/{ids}


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Delete Inspections
      operationId: v4.delete.inspections.ids
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to be deleted.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/availableDates:
    get:
      description: 'Gets available dates for scheduling an inspection, starting on the specified {startDate}. This API allows a date range of up to 31 days. Note that this API does not filter the available dates based on the Schedule Cut-off Time and Schedule Number of Days Out fields on the Civic Platform inspection calendar. To filter the available dates based on the Schedule Cut-off Time and Schedule Number of Days Out inspection calendar fields, set both {validateScheduleNumOfDays} and {validateScheduleNumOfDays} parameters to true.


        **API Endpoint**: GET /v4/inspections/availableDates


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Available Dates for Inspection
      operationId: v4.get.inspections.availableDates
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Filter by inspection type id.
        in: query
        name: typeId
        schema:
          type: integer
          format: int64
      - description: Filter by record id.
        in: query
        name: recordId
        required: true
        schema:
          type: string
      - description: Filter by start date.
        in: query
        name: startDate
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request returns an array of available inspection dates. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                items:
                  description: Array of available inspection dates.
                  format: date
                  type: string
                type: array
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/checkAvailability:
    get:
      description: 'Checks inspection availability for a given record and inspection type. This API returns an array of inspectors and their available inspection dates and times, based on the record''s inspection workflow, calendar, and permissions. The results include available dates for the current and following months.


        **API Endpoint**: GET /v4/inspections/checkAvailability


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.3.4'
      summary: Check Inspection Availability
      operationId: v4.get.inspections.checkAvailability
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: 'The record to check. See [Get Records](./api-records.html#operation/v4.get.records.ids). '
        in: query
        name: recordId
        required: true
        schema:
          type: string
      - description: 'The inspection type to check for the specified record. See [Get All Inspection Types for Record](./api-records.html#operation/v4.get.records.recordIds.inspectionTypes). '
        in: query
        name: inspectionTypeId
        required: true
        schema:
          type: string
      - description: 'Filter by inspection id. See [Get All Inspections](./api-inspections.html#operation/v4.get.inspections). '
        in: query
        name: inspectionId
        schema:
          type: string
      - description: 'Filter by department. See [Get All Departments](./api-settings.html#operation/v4.get.settings.departments). '
        in: query
        name: department
        schema:
          type: string
      - description: Filter by start date, using the date format yyyy-mm-dd.
        in: query
        name: startDate
        schema:
          type: string
      - description: Filter by end date, using the date format yyyy-mm-dd.
        in: query
        name: endDate
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionAvailabilityArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/schedule:
    post:
      description: 'Creates an inspection with the specified inspection and scheduling information. The Schedule Inspection API automatically sets the inspection status to "Scheduled" and category to "Insp Scheduled".


        **API Endpoint**: POST /v4/inspections/schedule


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Schedule Inspection
      operationId: v4.post.inspections.schedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestSchedule_inspectionModel'
        description: The inspection to schedule.
        required: true
  /v4/inspections/{id}:
    put:
      description: 'Updates an inspection with the specified inspection details such as schedule date, time, and inspector. The Update Inspection API updates the inspection status and category with the specified status and category request fields.


        **API Endpoint**: PUT /v4/inspections/{id}


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Update Inspection
      operationId: v4.put.inspections.id
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The ID of the inspection to update.
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestUpdate_inspectionModel'
        description: The inspection information to be updated.
        required: true
  /v4/inspections/{id}/reschedule:
    put:
      description: 'Updates an inspection with the specified schedule date, time, inspectorId, and comments. The Reschedule Inspection API automatically sets the inspection status to "Scheduled" and category to "Insp Scheduled".


        **API Endpoint**: PUT /v4/inspections/{id}/reschedule


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Reschedule Inspection
      operationId: v4.put.inspections.id.reschedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Inspection Id
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestReschedule_inspectionModel'
        description: The inspection information to reschedule.
        required: true
  /v4/inspections/{id}/result:
    put:
      description: 'Provides the results of a specified inspection.


        **API Endpoint**: PUT /v4/inspections/{id}/result


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Result Inspection
      operationId: v4.put.inspections.id.result
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Inspection Id
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestUpdate_inspectionModel'
        description: The inspection result to update.
        required: true
  /v4/inspections/{id}/schedule:
    put:
      description: 'Updates a pending inspection with the specified inspection details such as schedule date, time, and inspector. The Schedule Pending Inspection API automatically sets the inspection status to "Scheduled" and category to "Insp Scheduled".


        **API Endpoint**: PUT /v4/inspections/{id}/schedule


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Schedule Pending Inspection
      operationId: v4.put.inspections.id.schedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Inspection Id
        in: path
        name: id
        required: true
