      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestSchedule_inspectionModel'
        description: The inspection information to update.
        required: true
  /v4/inspections/{ids}/assign:
    put:
      description: 'Assigns an inspector to the specified inspection.


        **API Endpoint**: PUT /v4/inspections/{ids}/assign


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Assign Inspections
      operationId: v4.put.inspections.ids.assign
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to assign
        in: path
        name: ids
        required: true
        schema:
          type: string
      - description: The inspector to assign to.
        in: query
        name: inspectorId
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
