        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{ids}/cancel:
    delete:
      description: 'Cancels scheduled inspections.


        **API Endpoint**: DELETE /v4/inspections/{ids}/cancel


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Cancel Inspections
      operationId: v4.delete.inspections.ids.cancel
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to cancel.
        in: path
        name: ids
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/related:
    get:
      description: 'Gets the related (child) inspections for the specified parent inspection.


        **API Endpoint**: GET /v4/inspections/{id}/related


        **Scope**: inspections


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get Related Inspections
      operationId: v4.get.inspections.id.related
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/idInspection'
      - description: Filter by type of inspection relationship
        in: query
        name: relationship
        required: false
        schema:
          type: string
          enum:
          - child
          - parent
          - renewal
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/response_inspectionRelatedModelArray'
                type: array
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    post:
      description: 'Adds related (child) inspections to the specified parent inspection.


        **API Endpoint**: POST /v4/inspections/{id}/related


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Create Related Inspections
      operationId: v4.post.inspections.id.related
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/idInspection'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
      requestBody:
        content:
          application/json:
            schema:
              items:
                format: int64
                type: integer
              type: array
        description: An array of inspection IDs to be linked to the parent inspection. See [Get All Inspections](./api-inspections.html#operation/v4.get.inspections), [Get Related Inspections](./api-inspections.html#operation/v4.get.inspections.id.related).
        required: true
  /v4/inspections/{id}/related/{childIds}:
    delete:
      description: 'Deletes one or more related (child) inspections from the specified parent inspection.


        **API Endpoint**: DELETE /v4/inspections/{id}/related/{childIds}


        **Scope**: inspections


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Delete Related Inspections
      operationId: v4.delete.inspections.id.related.childIds
      tags:
      - Inspections
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The ID of the inspection to fetch.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Comma-delimited IDs of child inspections to be deleted.
        in: path
        name: childIds
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/lang'
      responses:
