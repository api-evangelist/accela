openapi: 3.2.0
info:
  description: The Settings API provides configuration values that have been defined in Civic Platform Administration, typically as standard choice values. The Settings APIs are helpful when you need reference or custom-configured values in your API calls.
  title: Settings/Records API
  version: v4
servers:
- url: https://apis.accela.com/
tags:
- name: Settings/Records
paths:
  /v4/settings/records/constructionTypes:
    get:
      description: 'Gets the construction types for the specified record type.


        **API Endpoint**: GET /v4/settings/records/constructionTypes


        **Scope**: records


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Record Construction Types
      operationId: v4.get.settings.records.constructionTypes
      tags:
      - Settings/Records
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_settingValueModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/expirationStatuses:
    get:
      description: 'Gets the expiration status values for use with records..


        **API Endpoint**: GET /v4/settings/records/expirationStatuses


        **Scope**: records


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Record Expiration Statuses
      operationId: v4.get.settings.records.expirationStatuses
      tags:
      - Settings/Records
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_settingValueModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types:
    get:
      description: 'Gets predefined record types.


        **API Endpoint**: GET /v4/settings/records/types


        **Scope**: records


        **App Type**: All


        **Authorization Type**: No authorization required


        **Civic Platform version**: 7.3.2'
      summary: Get All Record Types
      operationId: v4.get.settings.records.types
      tags:
      - Settings/Records
      parameters:
      - $ref: '#/components/parameters/offset'
      - description: Search result size limit.
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          enum:
          - range[1,1000]
      - description: Filter by module. This is required for citizen-facing apps, but not required for agency-facing apps.
        in: query
        name: module
        required: true
        schema:
          type: string
      - description: Filter by whether or not it is a fee estimate.
        in: query
        name: isFeeEstimate
        schema:
          type: boolean
          enum:
          - 'true'
          - 'false'
      - description: Filter by action associated with the record type.
        in: query
        name: action
        schema:
          type: string
          enum:
          - createApplication
          - createHuntingLicense
          - amendApplication
          - amendContact
      - description: The related objects to be returned with the response. The related object(s) will be returned if data exists; if data does not exist, the requested object(s) will not be included in the response.
        in: query
        name: expand
        schema:
          type: string
          enum:
          - associations
      - description: Filter by record type filter name.
        in: query
        name: filterName
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_recordTypeModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types/{recordTypeId}/assetTypes:
    get:
      description: 'Returns all asset types for a given record type.


        **API Endpoint**: GET /v4/settings/records/types/{recordTypeId}/assetTypes


        **Scope**: records


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 9.0.0'
      summary: Get All Asset Types for Record Type
      operationId: v4.get.settings.records.types.recordTypeId.assetTypes
      tags:
      - Settings/Records
      parameters:
      - description: The id of the record type to fetch.
        in: path
        name: recordTypeId
        required: true
        schema:
          type: string
      - description: Filter by asset group.
        in: query
        name: group
        schema:
          type: string
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_recordTypeAssetTypeModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types/{id}/customForms:
    get:
      description: 'Gets the metadata of custom forms for a specified record type.


        **API Endpoint**: GET /v4/settings/records/types/{id}/customForms


        **Scope**: records


        **App Type**: All


        **Authorization Type**: No authorization required


        **Civic Platform version**: 7.3.2'
      summary: Get All Custom Forms Metadata for Record Type
      operationId: v4.get.settings.records.types.id.customForms
      tags:
      - Settings/Records
      parameters:
      - description: The id of the record type to fetch.
        in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_customFormMetadataModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types/{id}/customTables:
    get:
      description: 'Gets the metadata of all custom tables for a specified record type.


        **API Endpoint**: GET /v4/settings/records/types/{id}/customTables


        **Scope**: records


        **App Type**: All


        **Authorization Type**: No authorization required


        **Civic Platform version**: 7.3.2'
      summary: Get All Custom Tables Metadata for Record Type
      operationId: v4.get.settings.records.types.id.customTables
      tags:
      - Settings/Records
      parameters:
      - description: The id of the record type to fetch.
        in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_customTableMetadataModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types/{id}/fees/schedules:
    get:
      description: 'Gets the types of available fee schedules.


        **API Endpoint**: GET /v4/settings/records/types/{id}/fees/schedules


        **Scope**: records


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Fee Schedules for Record Type
      operationId: v4.get.settings.records.types.id.fees.schedules
      tags:
      - Settings/Records
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The ID of the record type to fetch.
        in: path
        name: id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response_settingValueModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/settings/records/types/{id}/statuses:
    get:
      description: 'Gets the status values for use with a specified record type.


        **API Endpoint**: GET /v4/settings/records/types/{id}/statuses


        **Scope**: records


        **App Type**: All


        **Authorization Type**: Access token


        **Civic Platform version**: 7.3.2'
      summary: Get All Statuses for Record Type
      operationId: v4.get.settings.records.types.id.statuses
      tags:
      - Settings/Records
      parameters:
      - $ref: '#/components/parameters/authHeaderParam'
      - description: The ID of the record type to fetch.
        in: path
