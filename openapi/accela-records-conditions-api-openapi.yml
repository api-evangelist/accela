        description: Record condition information to be updated.
        required: true
  /v4/records/{recordId}/conditions/{id}/histories:
    get:
      description: 'Gets the history for a given record condition.


        **API Endpoint**: GET /v4/records/{recordId}/conditions/{id}/histories


        **Scope**: records


        **App Type**: Agency


        **Authorization Type**: Access token


        **Civic Platform version**: 9.0.0'
