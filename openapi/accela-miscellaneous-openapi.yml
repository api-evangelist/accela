      headers:
        $ref: '#/definitions/headerBatchRequest'
      method:
        description: The HTTP method of the operation to be invoked.
        enum:
        - GET
        - PUT
        - POST
        - DELETE
        type: string
      body:
        description: (For PUT and POST methods) A JSON string containing the request parameters for the operation to be invoked.
        type: string
      relativeUrl:
        description: The relative URL of the operation to be invoked, for example '/v4/records'. Do not invoke the Batch Request
          API; i.e. do not specify '/v4/batch' as the relativeUrl.
        type: string
    example: "\r\n[\r\n\n  {\r\n\n    \"headers\": {\r\n\n      \"x-accela-agency\": \"DemoAgency\"\r\n\n    },\r\n\n    \"\
      method\": \"GET\",\r\n\n    \"relativeUrl\": \"/v4/records?offset=0&limit=2\"\r\n\n  },\r\n\n  {\r\n\n    \"headers\"\
      : {\r\n\n      \"x-accela-agency\": \"BPTDEV\"\r\n\n    },\r\n\n    \"method\": \"GET\",\r\n\n    \"relativeUrl\": \"\
      /v4/records/BPTDEV-15EST-00000-00014\"\r\n\n  },\r\n\n  {\r\n\n    \"headers\": {\r\n\n      \"x-accela-agency\": \"\
      BPTDEV\"\r\n\n    },\r\n\n    \"method\": \"POST\",\r\n\n    \"relativeUrl\": \"/v4/records\",\r\n\n    \"body\": {\r\
      \n\n      \"type\": {\r\n\n        \"id\": \"Building-Residential-Alteration-NA\"\r\n\n      },\r\n\n      \"description\"\
      : \"Residence alteration\",\r\n\n      \"parcels\": [\r\n\n        {\r\n\n          \"parcelNumber\": \"005020018\"\r\
      \n\n        }\r\n\n      ]\r\n\n    }\r\n\n  }\r\n\n]\t\t\t\r\n\t\t"
  response_batchResponseArray:
    type: object
    properties:
      result:
        items:
          $ref: '#/definitions/batchResponse'
        type: array
      status:
        type: integer
        description: The return status for the batch request.
  batchResponse:
    type: object
    properties:
      result:
        description: The HTTP response from the invoked operation. The order of the results in the response array corresponds
          to the same order used in the request array.
        items:
          type: object
        type: array
