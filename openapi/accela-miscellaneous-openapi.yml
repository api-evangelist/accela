basePath: /
host: apis.accela.com
info:
  description: Miscellaneous Accela API
  title: Miscellaneous
  version: v4
schemes:
- https
swagger: '2.0'
tags:
- name: AA Version
  description: This is to return the version number of the AA server that is running, which allows the mobile app to make
    decisions as to what API's they have available.
- name: App Settings
  description: App settings are defined when a developer registers the app on [Accela Developer Portal](https://developer.accela.com).
    These settings include app name, ID, and so forth.
- name: Batch
  description: API for batch API requests.
- name: Conditions
  description: "**Conditions**\n\n\r\n\t\tThe system provides standard conditions\r\n\t\tfor different record types(permits,\
    \ licenses, inspections, and so forth). Depending on the condition,\r\n\t\tcondition violations result in one of the following\
    \ automatic settings to be applied to the inspections: <br/>- **Lock** : Prevents almost any operation,\r\n\t\texcept\
    \ operations that result in removal of the lock,\r\n\t\tfrom occurring.\r\n\t\t<br/>- **Hold** : Restricts the addition\
    \ of an activity and editing of components.\r\n\t\t<br/>- **Notice** : Indicates special instructions to the person that\
    \ completes the application. The system displays a message when you open the application or any component associated with\
    \ the application. This condition does not impede record processing.\r\n\t\t<br/>- **Required** : Indicates that you must\
    \ complete a specified activity or field before proceeding to the next step in a workflow.\r\n\t\t\n\n **Example Use Case**\
    \ \n\n\r\n\t\tA drainage study must occur prior to approval of a building permit\r\n\t\tfor new development. In this example,\r\
    \n\t\tthe drainage study requirement comprises the standard condition.You create the standard condition,\r\n\t\tname it\
    \ D01 Drainage Study,\r\n\t\tand associate it with the Building/Building Permit/Drainage/Grading record type. When a user\
    \ creates a new permit application of the Building/Building Permit/Drainage/Grading record type,\r\n\t\tthe D01 Drainage\
    \ Study condition applies to the new application record.\n\n\r\n\t\tThe system uses conditions at the record level and\
    \ record component level.Any condition you place on a component,\r\n\t\tsuch as a record address,\r\n\t\tparcel,\r\n\t\
    \towner,\r\n\t\tlicensed professional,\r\n\t\tcontact,\r\n\t\tstructure,\r\n\t\testablishment,\r\n\t\tor asset,\r\n\t\t\
    affects any record that references the component.\n\n **Conditions of Approval** \n\nConditions of approval consist of\
    \ a list of predefined requirements that must be met in order to receive approval\r\n\t\tfor an inspection.\r\n\t\t"
- name: Filters
  description: Filters are user queries that are stored in Civic Platform and enable users to find information easily. Filters
    are configured in Civic Platform's Data Filter Portlet to display only the data that is relevant to the user in the context
    of their current business objective or use-case scenario.
- name: Geocoding
  description: The Geocoding API provides geo-coded address information based on map services configured on [Construct Admin
    Portal](https://admin.accela.com) > Agencies > {Agency} > Agency Settings > GIS Settings.
- name: Mileage
  description: API for tracking vehicle mileage associated with inspections.
- name: Time Accounting
  description: "For general time accounting, Civic Platform provides the ability for employees to record the amount of time\
    \ spent in performing their daily tasks, the descriptions and costs of materials used while performing those tasks, and\
    \ the usage of vehicles related to the tasks performed.\n\n\r\n\t\tCivic Platform captures time accounting information\
    \ in two contexts: \r\n\t\t<br/>- Time and materials\r\n\t\t<br/>- Time related to a particular process or group of processes\r\
    \n\t\t\n\n\r\n\t\tAs employees log their activity in the Time Accounting Tracker,\r\n\t\tthe agency calculates fees and\
    \ charges,\r\n\t\tand applies them to a record.Agencies can also record costs,\r\n\t\tfor reporting purposes,\r\n\t\t\
    not related to processing any specific information. The agency can define any number of time accounting types and assign\
    \ an hourly rate or percentage adjustment to use to\r\n\t\tfor each type.\r\n\t\t"
- name: Users
  description: "**Agency Users**\r\n\t\t\n\n\r\n\t\tAlthough \"users\" is a broad and general term, the Accela API's User\
    \ object (user API resource) represents the agency user. An agency user is a staff member of the agency who logs in the\
    \ Civic Platform back-office application.\r\n\t\t\n\n **Citizen Users** \r\n\t\t\n\n\r\n\t\tThe other type of users is\
    \ the citizen user.A citizen is any public user who logs in citizen-facing apps such as Citizen Access or other civic-engagement\
    \ apps using Accela API.The citizen user is represented by one of the following objects: \r\n\t\t<br/>- **Citizen Access\
    \ user**: user who logs in Citizen Access(citizenaccess/citizen API resource). \r\n\t\t<br/>- **CivicId**: a registered\
    \ user on the [Construct User Portal](https://user.accela.com),\r\n\t\tand can be linked to multiple user accounts(civicid\
    \ API resource)\r\n\t\t"
- name: Workflows
  description: "**Workflow Tasks**\n\n\r\n\t\tA workflow is a sequence of tasks that agency users follow to process a record.\
    \ When a user submits a new application,\r\n\t\tthe system creates a record of a certain record type and launches an instance\
    \ of the associated workflow. Users change the status of a workflow task to promote a record to the next task in the workflow.\n\
    \n\r\n\t\tExample Use Case: \n\n\r\n\t\tYou create a workflow that includes all the tasks to process a commercial building\
    \ permit.This workflow includes tasks such as application acceptance,\r\n\t\tbuilding review,\r\n\t\tpermit issuance,\r\
    \n\t\tinspections,\r\n\t\tcertificate of occupancy,\r\n\t\tand closure.\n\n\r\n\t\tRecord status determines the operations\
    \ you can perform on a record and your permission to perform those operations.For example,\r\n\t\twhen a record changes\
    \ its status,\r\n\t\tthe workflow can lock the record from further activity until the status changes to a status that\
    \ releases the lock.\n\n\r\n\t\tThe workflow can provide email notifications anytime the status changes.For each task\
    \ and task status,\r\n\t\tyou can notify a different individual.For example,\r\n\t\tyou can notify a contractor after\
    \ completion of a building inspection.The system can also notify public applicants.\n\n\r\n\t\tExample Use Case: \n\n\r\
    \n\t\tThe workflow limits access to a building permit record when the status changes to plan review.The workflow limits\
    \ access by restricting the ability of users to schedule inspections or result inspections,\r\n\t\tthe workflow only allows\
    \ users to view the record.When the record status changes to issued,\r\n\t\tusers can schedule the necessary inspections\
    \ and result an inspection.\n\n\r\n\t\tThe workflow definition comprises task names,\r\n\t\ttask owners,\r\n\t\ttask order,\r\
    \n\t\ttask time line,\r\n\t\tand sub-tasks.The process to follow depends on the workflow and the situation in which a\
    \ user changes a task status.<br/>- You can add sub-tasks,\r\n\t\talso known as activities,\r\n\t\tto each task. Sub-tasks\
    \ create a more detailed workflow process or outline the steps involved in each main level task.\r\n\t\t<br/>- You can\
    \ attach a document with a sub-task.For example,\r\n\t\tyou can attach a report of the results of the plan review or upload\
    \ the actual plans.\r\n\t\t<br/>- You can track the time you agency takes to process records,\r\n\t\texcluding the time\
    \ spent by external parties.This time tracking can help determine where an agency can improve efficiency.\r\n\t\t<br/>-\
    \ You can save a history of workflows to audit your business processes.\r\n\t\t"
paths:
  /v4/serverProperties:
    get:
      description: "Get the version number of the AA server that is running, which allows the mobile app to make decisions\
        \ as to what API's they have available.\n\n\n\n**API Endpoint**:  GET /v4/serverProperties \n\n**Scope**:  app_data\
        \ \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 19\n\n"
      summary: Get AA version
      operationId: v4.get.serverProperties
      tags:
      - AA Version
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_getAAVersionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/appsettings:
    get:
      description: "Gets the settings for the application.\n\n\n\n**API Endpoint**:  GET /v4/appsettings \n\n**Scope**:  app_data\
        \ \n\n**App Type**:  All \n\n**Authorization Type**:  App Credentials \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Get All App Settings
      operationId: v4.get.appsettings
      tags:
      - App Settings
      parameters:
      - in: query
        description: Comma-delimited app setting keys filter
        name: keys
        required: false
        type: string
      - in: query
        name: agency
        description: The agency the app belongs to.
        required: false
        type: string
      - in: query
        name: appId
        description: The ID of the registered app on http://developer.accela.com.
        required: false
        type: string
      - in: query
        name: appSecret
        description: The secret key of the registered app on http://developer.accela.com.
        required: false
        type: string
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_appSettingsArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/batch:
    post:
      description: "Invokes multiple operations on data related to multiple agencies in a single HTTP request. The Batch Request\
        \ API accepts an array of up to 25 HTTP requests, each with its required headers, body, method, and URL. The individual\
        \ operations are invoked via HTTPS. The response is an array containing the results from all requested operations\
        \ in the same order used in the request array.\n\n\n\n**API Endpoint**:  POST /v4/batch \n\n**Scope**:  batch_request\
        \ \n\n**App Type**:  All \n\n**Authorization Type**:  No authorization required \n\n**Civic Platform version**: All\n\
        \n"
      summary: Batch Request
      operationId: v4.post.batch
      tags:
      - Batch
      parameters:
      - in: body
        name: batchRequest
        description: The batch request information.
        required: true
        schema:
          $ref: '#/definitions/batchRequestModel'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_batchResponseArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/conditions/standard:
    get:
      description: "Gets the standard conditions available in the system.\n\n\n\n**API Endpoint**:  GET /v4/conditions/standard\
        \ \n\n**Scope**:  conditions \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Get All Standard Conditions
      operationId: v4.get.conditions.standard
      tags:
      - Conditions
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Filter by the standard condition type. See [Get All Standard Condition Types](./api-settings.html#operation/v4.get.settings.conditions.types).
        in: query
        name: type
        required: false
        type: string
      - description: Filter by standard condition group.
        in: query
        name: group
        required: false
        type: string
      - description: Filter by standard condition name.
        in: query
        name: name
        required: false
        type: string
      - description: Filter by standard condition severity.
        in: query
        name: severity
        required: false
        type: string
      - description: Filter by standard condition public display message.
        in: query
        name: publicDisplayMessage
        required: false
        type: string
      - description: Filter whether or not the standard condition is inheritable.
        in: query
        name: inheritable
        enum:
        - Y
        - N
        required: false
        type: string
      - description: Filter by standard condition priority. See [Get All Standard Condition Priorities](./api-settings.html#operation/v4.get.settings.conditions.priorities).
        format: int64
        in: query
        name: priority
        required: false
        type: integer
      - description: Filter by standard condition short comments.
        in: query
        name: shortComments
        required: false
        type: string
      - description: Filter by standard condition long comments.
        in: query
        name: longComments
        required: false
        type: string
      - description: Filter by standard condition  resolution action
        in: query
        name: resolutionAction
        required: false
        type: string
      - description: Filter whether or not the standard condition includes name in notice.
        in: query
        name: includeNameInNotice
        required: false
        type: boolean
      - description: Filter whether or not the standard condition includes short comments in notice.
        in: query
        name: includeShortCommentsInNotice
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice to the agency.
        in: query
        name: displayNoticeInAgency
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice to the citizens.
        in: query
        name: displayNoticeInCitizens
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice in the citizen fee.
        in: query
        name: displayNoticeInCitizensFee
        required: false
        type: boolean
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - description: Sort search result by one field name.
        in: query
        name: sort
        required: false
        type: string
      - description: The sort direction. Default is ASC.
        enum:
        - ASC
        - ' DESC'
        in: query
        name: direction
        required: false
        type: string
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_conditionModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/conditionApprovals/standard:
    get:
      description: "Gets the conditions of approval available in the system.\n\n\n\n**API Endpoint**:  GET /v4/conditionApprovals/standard\n\
        \n**Scope**:  conditions \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Get All Approval Conditions
      operationId: v4.get.conditionApprovals.standard
      tags:
      - Conditions
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Filter by the standard condition type. See [Get All Standard Condition Types](./api-settings.html#operation/v4.get.settings.conditions.types).
        in: query
        name: type
        required: false
        type: string
      - description: Filter by standard condition group.
        in: query
        name: group
        required: false
        type: string
      - description: Filter by standard condition name.
        in: query
        name: name
        required: false
        type: string
      - description: Filter by standard condition severity.
        in: query
        name: severity
        required: false
        type: string
      - description: Filter by standard condition public display message.
        in: query
        name: publicDisplayMessage
        required: false
        type: string
      - description: Filter whether or not the standard condition is inheritable.
        in: query
        name: inheritable
        enum:
        - Y
        - N
        required: false
        type: string
      - description: Filter by standard condition priority. See [Get All Standard Condition Priorities](./api-settings.html#operation/v4.get.settings.conditions.priorities).
        format: int64
        in: query
        name: priority
        required: false
        type: integer
      - description: Filter by standard condition short comments.
        in: query
        name: shortComments
        required: false
        type: string
      - description: Filter by standard condition long comments.
        in: query
        name: longComments
        required: false
        type: string
      - description: Filter by standard condition  resolution action
        in: query
        name: resolutionAction
        required: false
        type: string
      - description: Filter whether or not the standard condition includes name in notice.
        in: query
        name: includeNameInNotice
        required: false
        type: boolean
      - description: Filter whether or not the standard condition includes short comments in notice.
        in: query
        name: includeShortCommentsInNotice
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice to the agency.
        in: query
        name: displayNoticeInAgency
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice to the citizens.
        in: query
        name: displayNoticeInCitizens
        required: false
        type: boolean
      - description: Filter whether or not the standard condition displays the notice in the citizen fee.
        in: query
        name: displayNoticeInCitizensFee
        required: false
        type: boolean
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - description: Sort search result by one field name.
        in: query
        name: sort
        required: false
        type: string
      - description: The sort direction. Default is ASC.
        enum:
        - ASC
        - ' DESC'
        in: query
        name: direction
        required: false
        type: string
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_conditionApprovalModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/filters:
    get:
      description: "Returns Civic Platform search filters (previously known as \"quick queries\" in the Civic Platform application).\
        \ This API returns global filters and custom filters that the currently logged in user has permissions in the requested\
        \ type and module. Include the {type} URI parameter to get either a record, inspection, or workflow task filters.\n\
        \n\n\n**API Endpoint**:  GET /v4/filters\n\n**Scope**:  filters \n\n**App Type**:  Agency \n\n**Authorization Type**:\
        \  Access token \n\n**Civic Platform version**: 9.0.0\n\n"
      summary: Get All Filters
      operationId: v4.get.filters
      tags:
      - Filters
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: 'Filter by Civic Platform filter type. '
        enum:
        - Record
        - Inspection
        - WorkflowTask
        in: query
        name: type
        type: string
      - description: "Filter by Civic Platform module. If module is not specified, the default module is the currently logged-in\
          \ user's default Civic Platform module. \n\n**Added in Civic Platform version**: 9.2.0"
        in: query
        name: module
        type: string
      - description: "The offset position of the first record in the results response array. For example, if offset is 100,\
          \ the first item in the results array in the response is the 100th record in the search result list. \n\n**Added\
          \ in Civic Platform version**: 9.2.0"
        format: int64
        in: query
        name: offset
        required: false
        type: integer
      - description: "Search result size limit. \n\n**Added in Civic Platform version**: 9.2.0"
        format: int64
        in: query
        name: limit
        required: false
        type: integer
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_filterModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/filters/{id}/results:
    post:
      description: "Returns the search results of a given search filter (also known as \"Quick Queries\" or \"Saved Searches\"\
        ). \r\n\n\nStarting with Civic Platform 9.2.0, Get Filter Results supports the following fixed format parameters for\
        \ all filter types (Filter parameters are configured in Civic Platform Administration Tool > Data Filter.):\r\n<br/>$$TODAY$$\r\
        \n<br/>$$TODAY+N$$\r\n<br/>$$MODULE$$\r\n<br/>$$USERID$$\r\n<br/>**Note**: The $$MODULE$$ fixed format parameter is\
        \ not available for inspection filters in the Civic Platform Admin Tool. To specify a module for an inspection filter,\
        \ use the \"module\" field in the request payload.\r\n\t\t\t\t\n\n\n\n**API Endpoint**:  POST /v4/filters/{id}/results\
        \ \n\n**Scope**:  filters \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 9.0.0\n\n"
      summary: Get Filter Results
      operationId: v4.post.filters.id.results
      tags:
      - Filters
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The ID of the filter to fetch.
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Contains optional filter parameters.
        in: body
        name: body
        required: false
        schema:
          type: object
          properties:
            module:
              description: 'For an inspection filter type, specify "module" in the request payload. If module is not specified,
                the default module is the logged-in user''s module.


                **Added in Civic Platform version**: 9.2.0'
              type: string
      - $ref: '#/parameters/limit'
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: "A successful request returns the search results. The schema depends on the requested filter type,\
            \ that is, either a record, inspection, or work order task. \n\nNote: A successful request may return no data\
            \ matching the filter criteria. A successful request may also return messages related to Event Manager Scripting\
            \ Engine back-end processing."
          schema:
            items:
              $ref: '#/definitions/response_filterResults'
            type: array
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/geo/geocode/reverse:
    get:
      description: "Returns address information for the given longitude and latitude coordinates. This API returns address\
        \ information from map services configured on **[Construct Admin Portal](https://admin.accela.com) > {Agency} > Agency\
        \ Settings > GIS Settings**.\n\n\n\n**API Endpoint**:  GET /v4/geo/geocode/reverse \n\n**Scope**:  gis \n\n**App Type**:\
        \  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: All\n\n"
      summary: Reverse Geocode Address
      operationId: v4.get.geo.geocode.reverse
      tags:
      - Geocoding
      parameters:
      - description: The north-south, x-coordinate of an address. The value must be between -180 and +180.
        in: query
        required: true
        name: longitude
        type: string
      - description: The east-west, y-coordinate of an address. The value must be between -90 and +90.
        in: query
        name: latitude
        required: true
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: "Successful request. \n\nNote: A successful request may return no data matching the filter criteria.\
            \ A successful request may also return messages related to Event Manager Scripting Engine back-end processing."
          schema:
            $ref: '#/definitions/response_geocodeAddressModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/gis/dynamicThemes:
    get:
      description: "Get GIS dynamic themes by for the given service.\n\n\n\n**API Endpoint**:  GET /v4/gis/dynamicThemes \n\
        \n**Scope**:  gis \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**:\
