basePath: /
host: apis.accela.com
info:
  description: Use the Inspections API to manage inspection records during their complete lifecycle from application submittal
    to permit issuance or license issuance. Your agency may need to complete inspections on new property developments, homes,
    or complaints.
  title: Inspections
  version: v4
schemes:
- https
swagger: '2.0'
tags:
- name: Inspections
- name: Inspections/Checklists
- name: Inspections/Checklists/Checklist Items
- name: Inspections/Checklists/Checklist Items/Custom Forms
- name: Inspections/Checklists/Checklist Items/Custom Tables
- name: Inspections/Checklists/Documents
- name: Inspections/Comments
- name: Inspections/Condition Approvals
- name: Inspections/Conditions
- name: Inspections/Documents
- name: Inspections/Time Accounting
- name: Inspectors
paths:
  /v4/inspections:
    get:
      description: "Gets a list of inspections stored in the system.\n\n\n\n**API Endpoint**:  GET /v4/inspections \n\n**Scope**:\
        \  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\
        \n"
      summary: Get All Inspections
      operationId: v4.get.inspections
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Filter by multiple (comma-delimited) inspection types. See [Get All Inspection Types](./api-settings.html#operation/v4.get.settings.inspections.types).
        in: query
        name: types
        required: false
        type: string
      - description: The start date of schedule date range filter. Use the date format yyyy-mm-dd.
        in: query
        name: scheduledDateFrom
        required: false
        type: string
      - description: The end date of schedule date range filter. Use the date format yyyy-mm-dd.
        in: query
        name: scheduledDateTo
        required: false
        type: string
      - description: 'Filter by inspector IDs. See [Get All Inspectors](./api-inspections.html#operation/v4.get.inspectors). '
        in: query
        name: inspectorIds
        required: false
        type: string
      - description: Filter by district IDs.
        in: query
        name: districtIds
        required: false
        type: string
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/limit'
      - description: Filter by module.
        in: query
        name: module
        required: false
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{ids}:
    get:
      description: "Gets the information for one or more requested inspections.\n\n\n\n**API Endpoint**:  GET /v4/inspections/{ids}\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Get Inspections
      operationId: v4.get.inspections.ids
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to fetch.
        in: path
        name: ids
        required: true
        type: string
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    delete:
      description: "Deletes one or more specified inspections.\n\n\n\n**API Endpoint**:  DELETE /v4/inspections/{ids} \n\n\
        **Scope**:  inspections \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**:\
        \ 7.3.2\n\n"
      summary: Delete Inspections
      operationId: v4.delete.inspections.ids
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to be deleted.
        in: path
        name: ids
        required: true
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/availableDates:
    get:
      description: "Gets available dates for scheduling an inspection, starting on the specified {startDate}. This API allows\
        \ a date range of up to 31 days. Note that this API does not filter the available dates based on the Schedule Cut-off\
        \ Time and Schedule Number of Days Out fields on the Civic Platform inspection calendar. To filter the available dates\
        \ based on the Schedule Cut-off Time and Schedule Number of Days Out inspection calendar fields, set both {validateScheduleNumOfDays}\
        \ and {validateScheduleNumOfDays} parameters to true.\n\n\n\n**API Endpoint**:  GET /v4/inspections/availableDates\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Get All Available Dates for Inspection
      operationId: v4.get.inspections.availableDates
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Filter by inspection type id.
        format: int64
        in: query
        name: typeId
        type: integer
      - description: Filter by record id.
        in: query
        name: recordId
        required: true
        type: string
      - description: Filter by start date.
        in: query
        name: startDate
        required: true
        type: string
      - $ref: '#/parameters/limit'
      - $ref: '#/parameters/offset'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request returns an array of available inspection dates. Note: A successful request may
            return no data matching the filter criteria. A successful request may also return messages related to Event Manager
            Scripting Engine back-end processing.'
          schema:
            items:
              description: Array of available inspection dates.
              format: date
              type: string
            type: array
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/checkAvailability:
    get:
      description: "Checks inspection availability for a given record and inspection type. This API returns an array of inspectors\
        \ and their available inspection dates and times, based on the record's inspection workflow, calendar, and permissions.\
        \ The results include available dates for the current and following months. \n\n\n\n**API Endpoint**:  GET /v4/inspections/checkAvailability\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.3.4\n\n"
      summary: Check Inspection Availability
      operationId: v4.get.inspections.checkAvailability
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: 'The record to check. See [Get Records](./api-records.html#operation/v4.get.records.ids). '
        in: query
        name: recordId
        required: true
        type: string
      - description: 'The inspection type to check for the specified record. See [Get All Inspection Types for Record](./api-records.html#operation/v4.get.records.recordIds.inspectionTypes). '
        in: query
        name: inspectionTypeId
        required: true
        type: string
      - description: 'Filter by inspection id. See [Get All Inspections](./api-inspections.html#operation/v4.get.inspections). '
        in: query
        name: inspectionId
        type: string
      - description: 'Filter by department. See [Get All Departments](./api-settings.html#operation/v4.get.settings.departments). '
        in: query
        name: department
        type: string
      - description: Filter by start date, using the date format yyyy-mm-dd.
        in: query
        name: startDate
        type: string
      - description: Filter by end date, using the date format yyyy-mm-dd.
        in: query
        name: endDate
        type: string
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionAvailabilityArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/schedule:
    post:
      description: "Creates an inspection with the specified inspection and scheduling information. The Schedule Inspection\
        \ API automatically sets the inspection status to \"Scheduled\" and category to \"Insp Scheduled\".\n\n\n\n**API Endpoint**:\
        \  POST /v4/inspections/schedule \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access\
        \ token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Schedule Inspection
      operationId: v4.post.inspections.schedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The inspection to schedule.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestSchedule_inspectionModel'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}:
    put:
      description: "Updates an inspection with the specified inspection details such as schedule date, time, and inspector.\
        \ The Update Inspection API updates the inspection status and category with the specified status and category request\
        \ fields.\n\n\n\n**API Endpoint**:  PUT /v4/inspections/{id} \n\n**Scope**:  inspections \n\n**App Type**:  Agency\
        \ \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Update Inspection
      operationId: v4.put.inspections.id
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The inspection information to be updated.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestUpdate_inspectionModel'
      - description: The ID of the inspection to update.
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/reschedule:
    put:
      description: "Updates an inspection with the specified schedule date, time, inspectorId, and comments. The Reschedule\
        \ Inspection API automatically sets the inspection status to \"Scheduled\" and category to \"Insp Scheduled\".\n\n\
        \n\n**API Endpoint**:  PUT /v4/inspections/{id}/reschedule \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n\
        **Authorization Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Reschedule Inspection
      operationId: v4.put.inspections.id.reschedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The inspection information to reschedule.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestReschedule_inspectionModel'
      - description: Inspection Id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/result:
    put:
      description: "Provides the results of a specified inspection.\n\n\n\n**API Endpoint**:  PUT /v4/inspections/{id}/result\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Result Inspection
      operationId: v4.put.inspections.id.result
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The inspection result to update.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestUpdate_inspectionModel'
      - description: Inspection Id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/schedule:
    put:
      description: "Updates a pending inspection with the specified inspection details such as schedule date, time, and inspector.\
        \ The Schedule Pending Inspection API automatically sets the inspection status to \"Scheduled\" and category to \"\
        Insp Scheduled\".\n\n\n\n**API Endpoint**:  PUT /v4/inspections/{id}/schedule \n\n**Scope**:  inspections \n\n**App\
        \ Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Schedule Pending Inspection
      operationId: v4.put.inspections.id.schedule
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The inspection information to update.
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestSchedule_inspectionModel'
      - description: Inspection Id
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionModel'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{ids}/assign:
    put:
      description: "Assigns an inspector to the specified inspection.\n\n\n\n**API Endpoint**:  PUT /v4/inspections/{ids}/assign\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Assign Inspections
      operationId: v4.put.inspections.ids.assign
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to assign
        in: path
        name: ids
        required: true
        type: string
      - description: The inspector to assign to.
        in: query
        name: inspectorId
        required: true
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{ids}/cancel:
    delete:
      description: "Cancels scheduled inspections.\n\n\n\n**API Endpoint**:  DELETE /v4/inspections/{ids}/cancel \n\n**Scope**:\
        \  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\
        \n"
      summary: Cancel Inspections
      operationId: v4.delete.inspections.ids.cancel
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: Comma-delimited IDs of the inspections to cancel.
        in: path
        name: ids
        required: true
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/related:
    get:
      description: "Gets the related (child) inspections for the specified parent inspection.\n\n\n\n**API Endpoint**:  GET\
        \ /v4/inspections/{id}/related \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access\
        \ token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Get Related Inspections
      operationId: v4.get.inspections.id.related
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - $ref: '#/parameters/idInspection'
      - description: Filter by type of inspection relationship
        enum:
        - child
        - parent
        - renewal
        in: query
        name: relationship
        required: false
        type: string
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            items:
              $ref: '#/definitions/response_inspectionRelatedModelArray'
            type: array
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
    post:
      description: "Adds related (child) inspections to the specified parent inspection.\n\n\n\n**API Endpoint**:  POST /v4/inspections/{id}/related\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  Agency \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Create Related Inspections
      operationId: v4.post.inspections.id.related
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - $ref: '#/parameters/idInspection'
      - $ref: '#/parameters/lang'
      - description: An array of inspection IDs to be linked to the parent inspection. See [Get All Inspections](./api-inspections.html#operation/v4.get.inspections),
          [Get Related Inspections](./api-inspections.html#operation/v4.get.inspections.id.related).
        in: body
        name: body
        required: true
        schema:
          items:
            format: int64
            type: integer
          type: array
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{id}/related/{childIds}:
    delete:
      description: "Deletes one or more related (child) inspections from the specified parent inspection.\n\n\n\n**API Endpoint**:\
        \  DELETE /v4/inspections/{id}/related/{childIds} \n\n**Scope**:  inspections \n\n**App Type**:  Agency \n\n**Authorization\
        \ Type**:  Access token \n\n**Civic Platform version**: 7.3.2\n\n"
      summary: Delete Related Inspections
      operationId: v4.delete.inspections.id.related.childIds
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - description: The ID of the inspection to fetch.
        in: path
        name: id
        required: true
        type: string
      - description: Comma-delimited IDs of child inspections to be deleted.
        in: path
        name: childIds
        required: true
        type: string
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_resultModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{inspectionId}/comments:
    get:
      description: "Gets the comments for the specified inspection.\n\n\n\n**API Endpoint**:  GET /v4/inspections/{inspectionId}/comments\
        \ \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
        \ version**: 7.3.2\n\n"
      summary: Get All Comments for Inspection
      operationId: v4.get.inspections.inspectionId.comments
      tags:
      - Inspections
      parameters:
      - $ref: '#/parameters/authHeaderParam'
      - $ref: '#/parameters/inspectionId'
      - $ref: '#/parameters/fields'
      - $ref: '#/parameters/lang'
      responses:
        '200':
          description: 'Successful request. Note: A successful request may return no data matching the filter criteria. A
            successful request may also return messages related to Event Manager Scripting Engine back-end processing.'
          schema:
            $ref: '#/definitions/response_inspectionCommentModelArray'
        '400':
          description: Invalid request.
        '401':
          description: Authorization failed.
        '403':
          description: Forbidden request.
        '404':
          description: Requested resource not found.
        '500':
          description: Internal server error or bad connection.
  /v4/inspections/{inspectionIds}/histories:
    get:
      description: "Gets the history for the specified inspections.\n\n\n\n**API Endpoint**: GET /v4/inspections/{inspectionIds}/histories\
        \  \n\n**Scope**:  inspections \n\n**App Type**:  All \n\n**Authorization Type**:  Access token \n\n**Civic Platform\
