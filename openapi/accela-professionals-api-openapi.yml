        in: query
        name: firstName
        required: false
        schema:
          type: string
      - description: Filter by License Contact Middle Name
        in: query
        name: middleName
        required: false
        schema:
          type: string
      - description: Filter by License Contact Last Name
        in: query
        name: lastName
        required: false
        schema:
          type: string
      - description: Filter by Email
        in: query
        name: email
        required: false
        schema:
          type: string
      - description: Filter by first line of address.
        in: query
        name: addressLine1
        required: false
        schema:
          type: string
      - description: Filter by second line of address.
        in: query
        name: addressLine2
        required: false
        schema:
          type: string
      - description: Filter by third line of address.
        in: query
        name: addressLine3
        required: false
        schema:
          type: string
      - description: Filter by Business License
        in: query
        name: businessLicense
        required: false
        schema:
          type: string
      - description: Filter by Business Name
        in: query
        name: businessName
        required: false
        schema:
          type: string
      - description: Filter by City
        in: query
        name: city
        required: false
        schema:
          type: string
