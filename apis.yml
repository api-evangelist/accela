- aid: accela:accela-trust-accounts-api
  name: Accela Trust Accounts API
  description: "Agency customers can deposit money into a trust account that the customer can drawn from\
    \ when they need to pay fees for an application. This is helpful for customers that have a large amount\
    \ of work they regularly perform in your jurisdiction, such as contractors or developers.\\\n\t\t\
    n\\ n\n\t\tCivic Platform allows you toset up trust accounts\n\t\tfor address,\n\t\tparcels,\n\t\t\
    licensed professionals and contacts.The trust account functionality allows you to establish and maintain\
    \ trust account information,\n\t\tperform trust account transactions,\n\t\tand print trust account\
    \ reports.\n\\ n\n\t\tWith the trust account feature,\n\t\tusers canset one primary trust account\
    \ and associate the trust account with one record or multiple records.\n\\ n\n\t\tCivic Platform can\
    \ send an email notification to the trust account manager when the trust account balance drops below\
    \ a certain amount.For example,\n\t\tif the trust account has a $100 threshold amount and the trust\
    \ account falls below $50,\n\t\tAccela Automation sends an e - mail notification to the trust account\
    \ manager.\n\\ n\n\t\tAdministrators can assign one or more trust accounts as global to one or more\
    \ modules,\n\t\twhich makes the trust accounts available to all records within the specified module.This\
    \ feature allows users to access a temporary trust accounts to process refunds."
