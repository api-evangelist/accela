aid: accela
name: Accela
description: >-
  Accela is a San Ramon, California govtech company whose cloud Civic Platform runs permitting, planning,
  licensing, code enforcement, inspections, asset management and citizen service requests for state and local
  government agencies worldwide. Its public developer surface is the Accela Construct API (V4) — a 417-operation
  REST API served from apis.accela.com and documented as fifteen Swagger 2.0 documents on the Accela Developer
  Portal, covering records, inspections, contacts and professionals, addresses/parcels/owners, assets and
  assessments, documents, payments and shopping carts, reports, search, citizens, CivicID and platform settings.
  Access is OAuth 2.0 against auth.accela.com with agency- and environment-scoped tokens, and every request is
  bound to a specific government tenant through the x-accela-agency and x-accela-environment headers.
