- aid: accela:accela-contacts-api
  name: Accela Contacts API
  description: >-
    A reference contact captures information about people or organizations involved in a business process.
    Contacts include licensed professionals, such as contractors, architects, engineers, and developers
    for which your agency maintains saved data. Contacts also include individuals related to a specific
    application or parcel, such as the applicant, billing contacts, or legal representatives.

     You can add new contacts to your system, or update information about existing contacts. As you manage
    applications and parcels on your system, you can keep track of certain individuals related to an application
    or a parcel. For example, you can keep track of the legal counsel for a property owner, or the accountant
    responsible for any fees assessed on a certain application.
