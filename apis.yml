apis:
- name: CivicData Open Data API (CKAN) — END OF LIFE
  description: >-
    CivicData.com is Accela's free open-data platform for government agencies, described on its own site
    as "a free open data platform built by Accela" and "Built on open source using CKAN". It exposes a
    live CKAN 2.9.9 Action API — package_list, package_search, status_show, datastore and the spatial
    extensions — publishing agency datasets such as building permits, inspections, food-facility records
    and air-quality permits. IT IS BEING SWITCHED OFF: the site states CivicData reached end of life on
    30 June 2026 and will be removed after 31 December 2026. Recorded here because it is a real, callable,
    first-party API today and because CKAN is a named standard in the government regulatory regime — but
    do not build on it.
  humanURL: https://www.civicdata.com/
  baseURL: https://www.civicdata.com/api/3
