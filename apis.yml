- aid: accela:accela-assessments-api
  name: Accela Assessments API
  description: >-
    In Civic Platform, an assessment is synonymous to an asset condition assessment. An asset condition
    assessment is a scheduled maintenance review and/or a quality review of a group of assets. Agencies
    may require such assessments for many different asset types such as vehicles, buildings, and water
    lines. Agencies may set different intervals for different asset types as well. For example, agency
    vehicles might require safety and emissions inspections yearly, while water lines might require an
    assessment every three months.


    In Civic Platform, an assessment is created based on its assessment type. An assessment type defines
    the assessment's custom attributes, rating types, and observation attributes.
  humanURL: https://developer.accela.com/docs/api_reference/api-index.html
  baseURL: https://apis.accela.com
