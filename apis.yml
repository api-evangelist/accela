- aid: accela:accela-reports-api
  name: Accela Reports API
  description: >-
    Civic Platform provides a set of standard reports, developed with reporting tools such as Crystal
    Reports, Microsoft Reporting Services. The Reports API sends requests to the report server to create
    reports. The report server connects to the system database, composes the report, and delivers the
    report in a predefined format. A report configuration contains report definition details and permission
    attributes used to run reports. <br/><br/> Each reporting service provides options to present reports
    in different formats including Adobe Acrobat (.PDF), Microsoft Word (.doc), and Microsoft Excel (.xls).
    For example, Crystal Reports provides Adobe Acrobat (PDF), MS Word (.doc), MS Excel (.xls), Rich Text
    Format (.rtf) and Comma-Delimited (CSV) output formatting options.
