- aid: accela:accela-time-accounting-api
  name: Accela Time Accounting API
  description: "For general time accounting, Civic Platform provides the ability for employees to record\
    \ the amount of time spent in performing their daily tasks, the descriptions and costs of materials\
    \ used while performing those tasks, and the usage of vehicles related to the tasks performed.\n\n\
    \n\t\tCivic Platform captures time accounting information in two contexts: \n\t\t<br/>- Time and materials\n\
    \t\t<br/>- Time related to a particular process or group of processes\n\t\t\n\n\n\t\tAs employees\
    \ log their activity in the Time Accounting Tracker,\n\t\tthe agency calculates fees and charges,\n\
    \t\tand applies them to a record.Agencies can also record costs,\n\t\tfor reporting purposes,\n\t\t\
    not related to processing any specific information. The agency can define any number of time accounting\
    \ types and assign an hourly rate or percentage adjustment to use to\n\t\tfor each type."
