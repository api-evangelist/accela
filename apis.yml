apis:
  - name: Accela Construct API (V4)
    description: >-
      The public REST API to the Accela Civic Platform. 417 operations across fifteen published Swagger 2.0
      documents cover transactional records, inspections and checklists, contacts and licensed professionals,
      addresses/parcels/owners, assets and condition assessments, documents, fees/payments/shopping carts,
      invoices and trust accounts, reports, global search, Citizen Access user management, CivicID, agencies
      and platform settings. Requests are scoped to a government tenant with x-accela-agency and
      x-accela-environment; responses use a uniform {status, code, message, more, traceId} envelope with
      offset/limit pagination and a fields= partial-response parameter. Base host is https://apis.accela.com; every
      operation path already carries the /v4 version prefix, matching host + basePath in the published specs.
    humanURL: https://developer.accela.com/docs/api_reference/api-index.html
    baseURL: https://apis.accela.com
    tags:
