- aid: accela:accela-workflows-api
  name: Accela Workflows API
  description: "**Workflow Tasks**\n\n\n\t\tA workflow is a sequence of tasks that agency users follow\
    \ to process a record. When a user submits a new application,\n\t\tthe system creates a record of\
    \ a certain record type and launches an instance of the associated workflow. Users change the status\
    \ of a workflow task to promote a record to the next task in the workflow.\n\n\n\t\tExample Use Case:\
    \ \n\n\n\t\tYou create a workflow that includes all the tasks to process a commercial building permit.This\
    \ workflow includes tasks such as application acceptance,\n\t\tbuilding review,\n\t\tpermit issuance,\n\
    \t\tinspections,\n\t\tcertificate of occupancy,\n\t\tand closure.\n\n\n\t\tRecord status determines\
    \ the operations you can perform on a record and your permission to perform those operations.For example,\n\
    \t\twhen a record changes its status,\n\t\tthe workflow can lock the record from further activity\
    \ until the status changes to a status that releases the lock.\n\n\n\t\tThe workflow can provide email\
    \ notifications anytime the status changes.For each task and task status,\n\t\tyou can notify a different\
    \ individual.For example,\n\t\tyou can notify a contractor after completion of a building inspection.The\
    \ system can also notify public applicants.\n\n\n\t\tExample Use Case: \n\n\n\t\tThe workflow limits\
    \ access to a building permit record when the status changes to plan review.The workflow limits access\
    \ by restricting the ability of users to schedule inspections or result inspections,\n\t\tthe workflow\
    \ only allows users to view the record.When the record status changes to issued,\n\t\tusers can schedule\
    \ the necessary inspections and result an inspection.\n\n\n\t\tThe workflow definition comprises task\
    \ names,\n\t\ttask owners,\n\t\ttask order,\n\t\ttask time line,\n\t\tand sub-tasks.The process to\
    \ follow depends on the workflow and the situation in which a user changes a task status.<br/>- You\
    \ can add sub-tasks,\n\t\talso known as activities,\n\t\tto each task. Sub-tasks create a more detailed\
    \ workflow process or outline the steps involved in each main level task.\n\t\t<br/>- You can attach\
    \ a document with a sub-task.For example,\n\t\tyou can attach a report of the results of the plan\
    \ review or upload the actual plans.\n\t\t<br/>- You can track the time you agency takes to process\
    \ records,\n\t\texcluding the time spent by external parties.This time tracking can help determine\
    \ where an agency can improve efficiency.\n\t\t<br/>- You can save a history of workflows to audit\
    \ your business processes."
  humanURL: https://developer.accela.com/docs/api_reference/api-index.html
