- aid: accela:accela-users-api
  name: Accela Users API
  description: "**Agency Users**\n\t\t\n\n\n\t\tAlthough \"users\" is a broad and general term, the Accela\
    \ API's User object (user API resource) represents the agency user. An agency user is a staff member\
    \ of the agency who logs in the Civic Platform back-office application.\n\t\t\n\n **Citizen Users**\
    \ \n\t\t\n\n\n\t\tThe other type of users is the citizen user.A citizen is any public user who logs\
    \ in citizen-facing apps such as Citizen Access or other civic-engagement apps using Accela API.The\
    \ citizen user is represented by one of the following objects: \n\t\t<br/>- **Citizen Access user**:\
    \ user who logs in Citizen Access(citizenaccess/citizen API resource). \n\t\t<br/>- **CivicId**: a\
    \ registered user on the [Construct User Portal](https://user.accela.com),\n\t\tand can be linked\
    \ to multiple user accounts(civicid API resource)"
