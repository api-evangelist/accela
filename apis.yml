- aid: accela:accela-assets-api
  name: Accela Assets API
  description: >-
    Assets can be any object that an agency owns or maintains. Assets have standard properties such as
    date of service, start value, current value, depreciation value, salvage value, size, etc.


    To manage and organize assets and asset types, Civic Platform supports several levels of asset classifications.
    Each asset is classified with an asset type, and each asset type can be organized within a group or
    by class type.


    In general, assets are classified by the following standard class types:


    <br/>- **Linear** - The linear class type indicates a relationship between two assets. For example,
    a section of street, sidewalk, or runway at the city municipal airport.<br/>- **Node** - Node-link
    linear combines assets to indicate an explicit relationship between the assets. Node-link linear requires
    the user to define the asset ID by identifying the assets on each end of the linear asset. For example,
    define a sewer main by identifying its end points such as Manholes. Manhole 'MH-01' flows to manhole
    'MH-02' which flows to manhole 'MH-03.' The node-link linear allows for the creation of the Sewer
    Main asset by naming the beginning and end point assets of each pipe. In this example, the agency
    can create two Sewer Main assets such as class type of node-link linear defined as 'MH-01 - MH-02'
    and 'MH-02 - MH-03.'<br/>- **Component** - The component class specifies assets that are independent
    and do not connect assets as a building or tools. A component is free of lines and nodes.<br/>- **Polygon**
    - The polygon class type includes assets such as water drainage area, a storm drainage area, or a
    catch basin.
  humanURL: https://developer.accela.com/docs/api_reference/api-index.html
  baseURL: https://apis.accela.com
  tags:
  - Assets
  properties:
  - type: OpenAPI
    url: openapi/accela-assets-api-openapi.yml
  - type: Documentation
    url: https://developer.accela.com/docs/
  - type: APIReference
    url: https://developer.accela.com/docs/api_reference/api-index.html
