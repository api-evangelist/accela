- aid: accela:accela-documentreview-api
  name: Accela Document Review API
  description: "The Document Review API supports integration of the Civic Platform's Electronic Document\
    \ Review (\"EDR\") feature with third-party document review tools. The EDR feature in Automation enables\
    \ agencies to manage and store documents from applicants as well as assign and manage document reviews.\n\
    \t\t\n\nAgencies can configure a connection to a third party document review tool so that when a user\
    \ clicks Review on a record detail page, the user can use the third party tool to review and annotate\
    \ the document. \n\nDocuments that have been reviewed in a third party tool can then be uploaded to\
    \ the Civic Platform, where agencies can take advantage of the Civic Platform's document management,\
    \ security, workflow and task assignment functionality to manage the documents.\n\nThe Document Review\
    \ API requires Automation version 7.3.3.5 and higher. For configuration information about integration\
    \ and data mapping between Civic Platform and a third-party document review application, see \"Integration\
    \ with Third Party Document Review Applications\" and \"Configuring Third Party Document Review Tool\
    \ Integration\" in [Civic Platform 7.3.3 Service Pack Release Notes](https://developer.dev.accela.com/docs/automationDocs/Accela%20Automation%207.3.3%20Service%20Pack%20Release%20Notes.pdf).\n\
    \n\n\nAccela recommends that an agency create an Automation user account dedicated to third-party\
    \ access."
  humanURL: https://developer.accela.com/docs/api_reference/api-index.html
