- aid: accela:accela-conditions-api
  name: Accela Conditions API
  description: "**Conditions**\n\n\n\t\tThe system provides standard conditions\n\t\tfor different record\
    \ types(permits, licenses, inspections, and so forth). Depending on the condition,\n\t\tcondition\
    \ violations result in one of the following automatic settings to be applied to the inspections: <br/>-\
    \ **Lock** : Prevents almost any operation,\n\t\texcept operations that result in removal of the lock,\n\
    \t\tfrom occurring.\n\t\t<br/>- **Hold** : Restricts the addition of an activity and editing of components.\n\
    \t\t<br/>- **Notice** : Indicates special instructions to the person that completes the application.\
    \ The system displays a message when you open the application or any component associated with the\
    \ application. This condition does not impede record processing.\n\t\t<br/>- **Required** : Indicates\
    \ that you must complete a specified activity or field before proceeding to the next step in a workflow.\n\
    \t\t\n\n **Example Use Case** \n\n\n\t\tA drainage study must occur prior to approval of a building\
    \ permit\n\t\tfor new development. In this example,\n\t\tthe drainage study requirement comprises\
    \ the standard condition.You create the standard condition,\n\t\tname it D01 Drainage Study,\n\t\t\
    and associate it with the Building/Building Permit/Drainage/Grading record type. When a user creates\
    \ a new permit application of the Building/Building Permit/Drainage/Grading record type,\n\t\tthe\
    \ D01 Drainage Study condition applies to the new application record.\n\n\n\t\tThe system uses conditions\
    \ at the record level and record component level.Any condition you place on a component,\n\t\tsuch\
    \ as a record address,\n\t\tparcel,\n\t\towner,\n\t\tlicensed professional,\n\t\tcontact,\n\t\tstructure,\n\
    \t\testablishment,\n\t\tor asset,\n\t\taffects any record that references the component.\n\n **Conditions\
    \ of Approval** \n\nConditions of approval consist of a list of predefined requirements that must\
    \ be met in order to receive approval\n\t\tfor an inspection."
  humanURL: https://developer.accela.com/docs/api_reference/api-index.html
  baseURL: https://apis.accela.com
  tags:
  - Conditions
  properties:
  - type: OpenAPI
    url: openapi/accela-conditions-api-openapi.yml
