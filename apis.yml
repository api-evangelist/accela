  - name: Accela Authentication API (OAuth 2.0)
    description: >-
      The Construct authorization server. Three operations — POST /oauth2/authorize (authorization code),
      POST /oauth2/token (authorization code, implicit and password-credential grants) and GET /oauth2/tokeninfo
      — issue and validate agency- and citizen-app access tokens bound to an agency, an environment and a set of
      Construct permission scopes.
    humanURL: https://developer.accela.com/docs/api_reference/api-auth.html
    baseURL: https://auth.accela.com
    tags:
      - Authentication
      - OAuth
      - Government
    tags_raw:
      - authentication
      - oauth
      - government
    properties:
      - type: OpenAPI
        url: openapi/accela-authentication-openapi.yml
      - type: Documentation
        url: https://developer.accela.com/docs/construct-apiAuth.html
      - type: Authentication
        url: authentication/accela-authentication.yml
      - type: OAuthScopes
        url: scopes/accela-scopes.yml
  - name: CivicData Open Data API (CKAN) — END OF LIFE
    description: >-
      CivicData.com is Accela's free open-data platform for government agencies, described on its own site as
      "a free open data platform built by Accela" and "Built on open source using CKAN". It exposes a live
      CKAN 2.9.9 Action API — package_list, package_search, status_show, datastore and the spatial extensions
      — publishing agency datasets such as building permits, inspections, food-facility records and air-quality
      permits. IT IS BEING SWITCHED OFF: the site states CivicData reached end of life on 30 June 2026 and
      will be removed after 31 December 2026. Recorded here because it is a real, callable, first-party API
      today and because CKAN is a named standard in the government regulatory regime — but do not build on it.
    humanURL: https://www.civicdata.com/
    baseURL: https://www.civicdata.com/api/3
    tags:
      - Open Data
      - CKAN
      - Government
      - Public Sector
    tags_raw:
